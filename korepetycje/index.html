<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#284a92">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Korepetycje">
<title>Korepetycje</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f3f4f8;--card:#fff;--text:#14161f;--muted:#6b7183;--faint:#9aa0b2;--line:#e5e7ef;--chip:#eceef4;
  --nav:#284a92;--nav-2:#2b3f86;--nav-text:#fff;
  --accent:#2f62d6;--accent-soft:#e7eefc;--accent-text:#fff;
  --ok:#16803c;--ok-bg:#e5f5ea;--bad:#c62828;--bad-bg:#fdecec;--warn:#a35a00;--warn-bg:#fff2da;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 3px 12px rgba(16,24,40,.05);
  --bar-bg:rgba(255,255,255,.86);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c0e14;--card:#171a23;--text:#e9ebf3;--muted:#9aa0b4;--faint:#6e7489;--line:#272b38;--chip:#222634;
    --nav:#1a2a58;--nav-2:#1d2d61;--nav-text:#fff;
    --accent:#7aa2ff;--accent-soft:#1f2a4a;--accent-text:#0c0e14;
    --ok:#4ade80;--ok-bg:#13301f;--bad:#f87171;--bad-bg:#3a1818;--warn:#fbbf24;--warn-bg:#3a2b0e;
    --shadow:none;--bar-bg:rgba(28,31,42,.88);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
h2,h3{margin:0;line-height:1.2}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- górny pasek ---------- */
.appbar{position:sticky;top:0;z-index:20;background:var(--nav);color:var(--nav-text);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:760px;margin:0 auto;height:60px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding:0 8px}
.appbar h1{margin:0;text-align:center;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-btn{border:0;background:none;color:inherit;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;position:relative;font-size:15px;font-weight:600}
.bar-btn:active{background:rgba(255,255,255,.12)}
.bar-btn svg.i{width:27px;height:27px}
.bar-btn .red{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:#ef4444;border:2px solid var(--nav)}
.bar-btn.txt{width:auto;padding:0 10px}

/* ---------- dolna nawigacja ---------- */
.bnav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));
  display:flex;padding:5px;border-radius:999px;background:var(--bar-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--line);box-shadow:0 8px 30px rgba(16,24,40,.14)}
.bnav button{flex:1;border:0;background:none;border-radius:999px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);font-size:12px;font-weight:500;min-width:0}
.bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bnav button.on{background:var(--chip);color:var(--accent);font-weight:600}
.bnav svg.i{width:26px;height:26px}

main{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}

/* ---------- karty ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.sec{font-size:22px;font-weight:800;margin:24px 2px 12px;display:flex;align-items:center;gap:10px}
.sec{white-space:nowrap}
.sec .more{margin-left:auto;white-space:nowrap;font-size:15px;font-weight:600;color:var(--accent);border:0;background:none;padding:4px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:16px}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.num{font-variant-numeric:tabular-nums}

.hero{background:var(--nav-2);color:#fff;border-radius:22px;padding:22px 22px 20px;cursor:pointer;position:relative;overflow:hidden}
.hero .lbl{opacity:.8;font-size:15px}
.hero .big{font-size:28px;font-weight:800;margin:8px 0 6px;padding-right:80px}
.hero .sub{font-size:18px;opacity:.95}
.hero .when{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:18px}
.hero .tag{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 6px 14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.tile svg.i{color:var(--accent);width:30px;height:30px}
.tile .v{font-size:21px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .l{font-size:13px;color:var(--muted);line-height:1.25;margin-top:4px}
@media (max-width:380px){.tile .v{font-size:17px}}

/* ---------- listy ---------- */
.lcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;background:color-mix(in srgb,var(--c) 14%,var(--chip));color:var(--c)}
.avatar.lg{width:72px;height:72px;font-size:26px}
.lname{font-weight:600;font-size:17px}
.lsub{color:var(--muted);font-size:14px;margin-top:1px}
.badge{display:inline-block;font-size:13px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.gray{background:var(--chip);color:var(--muted)}

.seg{display:flex;background:var(--chip);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.searchrow{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:14px;padding:0 12px;color:var(--muted);flex-direction:row}
.search input{border:0;background:none;padding:12px 0;width:100%;outline:none;color:var(--text)}
.sqbtn{width:48px;border:0;border-radius:14px;background:var(--chip);display:grid;place-items:center;color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);border-radius:99px;padding:9px 16px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--nav);color:#fff}

/* ---------- lekcje w listach ---------- */
.lesson{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.lesson::before{content:"";width:4px;border-radius:4px;background:var(--c);flex:none}
.lesson.virtual{border-style:dashed}
.lesson.st-cancelled{opacity:.55}
.lesson.st-cancelled .lname{text-decoration:line-through}
.lesson .t{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qa{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px;display:flex;align-items:center;gap:4px}
.qa button svg.i{width:16px;height:16px}
.qa .g{color:var(--ok)}.qa .r{color:var(--bad)}

/* ---------- grafik ---------- */
.weekbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px}
.weekbar h2{font-size:20px;font-weight:700}
.weekbar button{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--text);border-radius:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.dbtn{border:0;background:none;border-radius:14px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;color:var(--text);min-width:0}
.dbtn .dn{font-size:14px;color:var(--muted)}
.dbtn .dd{font-size:20px;font-weight:700}
.dbtn.today .dd{color:var(--accent)}
.dbtn.on{background:var(--nav)}
.dbtn.on .dn,.dbtn.on .dd{color:#fff}
.dbtn .cnt{position:absolute;top:-10px;right:0;min-width:22px;height:22px;border-radius:11px;background:var(--nav);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.dbtn.on .cnt{background:#fff;color:var(--nav)}
.daysum{font-size:14px;color:var(--muted);padding:10px 2px 0}
.tl{position:relative;margin-top:14px}
.hr{position:absolute;left:0;right:0;height:64px;cursor:pointer}
.hr span{position:absolute;left:0;top:-9px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hr::after{content:"";position:absolute;left:52px;right:0;top:0;border-top:1px solid var(--line)}
.blk{position:absolute;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--card));border-left:4px solid var(--c);padding:6px 10px;overflow:hidden;cursor:pointer;z-index:2;box-shadow:var(--shadow)}
.blk.virtual{background:color-mix(in srgb,var(--c) 7%,var(--card));outline:1px dashed color-mix(in srgb,var(--c) 45%,transparent);outline-offset:-1px}
.blk.st-cancelled{opacity:.5}
.blk.st-cancelled b{text-decoration:line-through}
.blk b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.blk .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .ok{position:absolute;top:6px;right:6px;color:var(--ok)}
.blk .ok svg.i{width:18px;height:18px}
.now{position:absolute;left:52px;right:0;border-top:2px solid #ef4444;z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#ef4444}

/* ---------- finanse ---------- */
.monthbar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.monthbar b{min-width:160px;text-align:center;font-size:17px}
.monthbar button{border:0;background:var(--chip);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.fhero{background:var(--nav-2);color:#fff;border-radius:22px;padding:22px}
.fhero .lbl{font-size:17px;opacity:.9}
.fhero .big{font-size:44px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.fhero .big small{font-size:30px;opacity:.6;font-weight:700}
.prog{height:10px;border-radius:5px;background:rgba(255,255,255,.25);margin:14px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(255,255,255,.2);padding-top:16px}
.fgrid .l{opacity:.85;font-size:15px}
.fgrid .v{font-size:23px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
.fgrid .s{opacity:.7;font-size:13px;line-height:1.3}
@media (max-width:380px){.fgrid .v{font-size:19px}}
.rowcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;cursor:pointer;box-shadow:var(--shadow)}
.rowcard .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:18px}
.ccol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;cursor:pointer;min-width:0}
.cval{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;min-height:14px}
.cbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.cbar{width:42%;max-width:26px;border-radius:7px 7px 3px 3px;min-height:3px;background:var(--accent);opacity:.55}
.cbar.b{background:var(--ok)}
.ccol.on .cbar{opacity:1}
.ccol.on .clbl{color:var(--text);font-weight:700}
.clbl{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat3>div{background:var(--chip);border-radius:14px;padding:12px 10px;min-width:0}
.stat3 .l{font-size:13px;color:var(--muted)}
.stat3 .v{font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.stat3 .v{font-size:15px}}
.mbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.mbar:first-child{margin-top:0}
.mbar .track{flex:1;height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.mbar .track i{display:block;height:100%;border-radius:5px}
.mbar .lbl{width:74px}
.mbar .amt{width:90px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.attn{display:flex;align-items:baseline;gap:6px}
.attn .big{font-size:34px;font-weight:800}
.prog2{height:10px;border-radius:5px;background:var(--chip);margin-top:10px;overflow:hidden;display:flex}
.prog2 i{display:block;height:100%}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.amount{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- profil ---------- */
.prof{text-align:center;padding:22px 16px}
.prof h2{font-size:24px;margin-top:10px}
.actions3{display:flex;justify-content:center;gap:12px;margin-top:16px}
.actions3 a{background:var(--chip);color:var(--text);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;min-width:78px}
.actions3 svg.i{color:var(--accent)}
.bal{display:flex;align-items:center;gap:14px}
.bal .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ledger .lrow{cursor:default}
.ledger .lrow.click{cursor:pointer}

/* ---------- przyciski ---------- */
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn svg.i{width:20px;height:20px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:15px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- arkusz (okno) ---------- */
dialog{border:0;padding:0;background:var(--card);color:var(--text);width:min(560px,100vw);max-width:100vw;max-height:92vh;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,10,18,.5)}
@media (max-width:640px){
  dialog{margin:auto 0 0;width:100vw;border-radius:22px 22px 0 0;max-height:92vh}
  dialog[open]{animation:up .22s ease-out}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.mbody{padding:10px 18px calc(20px + env(safe-area-inset-bottom));overflow:auto;max-height:92vh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.mhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.mhead h2{font-size:21px;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.mhead .x{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.mhead .x svg.i{width:18px;height:18px}
.f{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:10px}
label{display:grid;gap:5px;font-size:14px;color:var(--muted)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=color]{padding:3px;height:46px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
textarea{min-height:76px;resize:vertical}
.factions{display:flex;gap:10px;margin-top:8px}
.factions .btn{flex:1}
.factions .btn.danger{flex:0 0 auto}
.sched-row{display:grid;grid-template-columns:1.5fr 1fr .9fr 1.2fr 34px;gap:6px;align-items:center;margin-bottom:8px}
.sched-row input,.sched-row select{padding:10px 8px;font-size:15px}
@media (max-width:480px){.sched-row{grid-template-columns:1fr 1fr 1fr}.sched-row select[name=sday]{grid-column:1/3}.sched-row .xbtn{grid-column:3;grid-row:1;justify-self:end}}
.xbtn{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.xbtn svg.i{width:16px;height:16px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.quick .g{color:var(--ok)}.quick .r{color:var(--bad)}
.quick button svg.i{width:18px;height:18px}
.att{display:grid;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.att label{display:flex;align-items:center;gap:10px;color:var(--text);font-size:15px;padding:6px 0}
.checkline{display:flex;align-items:center;gap:10px;color:var(--text)}
.memberlist{max-height:240px;overflow:auto}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.methods button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 4px;font-size:14px;font-weight:600}
.methods button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none;z-index:100;font-size:15px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in" id="appbar"></div></header>
<main id="view"></main>

<script>
'use strict';
/* =========================================================
   Korepetycje – aplikacja do rozliczania korepetycji.
   Dane trzymane lokalnie w przeglądarce (localStorage).
   ========================================================= */

const KEY = 'korepetycje.v1';
const PALETTE = ['#2f62d6','#0e8fb0','#16a34a','#e2681b','#d6337a','#7c3aed','#c58f07','#dc2626','#0d9488','#4f46e5','#9333ea','#65a30d'];
const DAYS = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
const DAYS_SHORT = ['Pon','Wt','Śr','Czw','Pt','Sob','Nie'];
const MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MONTHS_SHORT = ['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
const METHODS = {cash:'Gotówka', transfer:'Przelew', blik:'BLIK', other:'Inne'};
const METHOD_COLORS = {cash:'#16a34a', transfer:'#2f62d6', blik:'#7c3aed', other:'#9aa0b2'};
const STATUS = {planned:'Zaplanowana', done:'Odbyta', late:'Odwołana z opłatą', cancelled:'Odwołana'};
const TRIAL = {'':'Zwykła lekcja', paid:'Lekcja próbna – płatna', free:'Lekcja próbna – darmowa'};
const trialBadge = e => e.trial ? `<span class="badge warn">${e.trial === 'free' ? 'próbna · darmowa' : 'próbna'}</span>` : '';

/* ---------- ikony ---------- */
const ICONS = {
  home:'<path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5V15h-5v5.5H5A1.5 1.5 0 0 1 3.5 19z"/>',
  users:'<circle cx="9" cy="8" r="3.3"/><path d="M2.8 19.5c.8-3.4 3.3-5.3 6.2-5.3s5.4 1.9 6.2 5.3"/><circle cx="17.2" cy="9" r="2.6"/><path d="M16.3 14.3c2.5.2 4.3 1.9 5 5"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17h.01M12 17h.01M16.5 17h.01"/>',
  wallet:'<rect x="3" y="5.5" width="18" height="14" rx="3"/><path d="M16 12.5h2.5M3 9.5h18"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  bell:'<path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 20.5a2.1 2.1 0 0 0 4 0"/>',
  plus:'<path d="M12 4.5v15M4.5 12h15"/>',
  archive:'<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V9M10 13h4"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  sort:'<path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/>',
  left:'<path d="m15 5-7 7 7 7"/>',
  right:'<path d="m9 5 7 7-7 7"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>',
  book:'<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
  phone:'<path d="M5 3.8h3.4l1.6 4.4-2.1 1.4a11.5 11.5 0 0 0 6.5 6.5l1.4-2.1 4.4 1.6V19a1.6 1.6 0 0 1-1.6 1.6C10.3 20.6 3.4 13.7 3.4 5.4A1.6 1.6 0 0 1 5 3.8z"/>',
  msg:'<path d="M4 5h16v11H9.5L4 20z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>',
  cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  up:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.5A1.5 1.5 0 0 0 8 21h8a1.5 1.5 0 0 0 1.5-1.5l1-12.5M9 7V4.5h6V7"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  group:'<circle cx="12" cy="7.5" r="3"/><circle cx="5" cy="10" r="2.3"/><circle cx="19" cy="10" r="2.3"/><path d="M7 19.5c.6-3 2.6-4.8 5-4.8s4.4 1.8 5 4.8M1.8 18c.4-2 1.6-3.3 3.2-3.5M22.2 18c-.4-2-1.6-3.3-3.2-3.5"/>',
  phoneapp:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/>'
};
const ic = (n, style = '') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${style ? ` style="${style}"` : ''}>${ICONS[n] || ''}</svg>`;

/* ---------- dane ---------- */
function emptyDb(){
  return {version:2, students:[], groups:[], lessons:[], payments:[], carry:[], settings:{defaultRate:80, defaultDuration:60, extraWeekly:0, lastBackup:null}};
}
function normalize(d){
  const e = emptyDb();
  const out = {...e, ...d, settings:{...e.settings, ...(d.settings || {})}};
  for(const k of ['students','groups','lessons','payments','carry']) if(!Array.isArray(out[k])) out[k] = [];
  out.version = 2;
  return out;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }
  catch(err){ console.error(err); }
  return emptyDb();
}
let db = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('Nie udało się zapisać danych: ' + e.message); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- daty ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const weekday = s => (parse(s).getDay() + 6) % 7;
const weekStart = s => addDays(s, -weekday(s));
const monthStart = s => s.slice(0, 8) + '01';
const monthEnd = s => { const d = parse(monthStart(s)); return ymd(new Date(d.getFullYear(), d.getMonth()+1, 0)); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h*60 + (m || 0); };
const fromMin = m => pad(Math.floor(m/60) % 24) + ':' + pad(m % 60);
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
function shiftMonth(ym, n){ const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function monthLabel(ym){ const [y,m] = ym.split('-').map(Number); return MONTHS[m-1] + ' ' + y; }
function fmtDate(s){ const d = parse(s); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateShort(s){ const d = parse(s); return `${DAYS_SHORT[weekday(s)]} ${d.getDate()}.${pad(d.getMonth()+1)}`; }
function fmtNum(s){ const d = parse(s); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`; }
function relDay(s){
  const n = daysBetween(today(), s);
  if(n === 0) return 'dziś'; if(n === 1) return 'jutro'; if(n === 2) return 'pojutrze';
  if(n === -1) return 'wczoraj'; if(n > 0) return `za ${n} dni`; return `${-n} dni temu`;
}

/* ---------- pieniądze ---------- */
const round2 = v => Math.round((+v || 0) * 100) / 100;
const nf = new Intl.NumberFormat('pl-PL', {minimumFractionDigits:0, maximumFractionDigits:2});
const nf2 = new Intl.NumberFormat('pl-PL', {minimumFractionDigits:2, maximumFractionDigits:2});
const zl = v => nf.format(round2(v)) + ' zł';
const zl2 = v => nf2.format(round2(v)) + ' zł';
const zlSigned = v => (v > 0 ? '+' : '') + zl(v);
const hours = min => (Math.round(min / 6) / 10).toString().replace('.', ',') + ' h';

/* ---------- pomocnicze ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = sel => document.querySelector(sel);
const student = id => db.students.find(s => s.id === id);
const group = id => db.groups.find(g => g.id === id);
const sname = id => student(id)?.name || '(usunięty uczeń)';
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const ownerOf = e => e.groupId ? group(e.groupId) : student(e.studentId);
const oname = e => ownerOf(e)?.name || '(usunięty)';
const ocolor = e => ownerOf(e)?.color || '#888';
const osubject = e => ownerOf(e)?.subject || '';
const byName = (a, b) => a.name.localeCompare(b.name, 'pl');
function rateOf(o){ return o && o.rate !== '' && o.rate != null ? +o.rate : +db.settings.defaultRate; }
function priceFor(kind, id, dur){ return round2(rateOf(kind === 'g' ? group(id) : student(id)) * (+dur || 0) / 60); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2300); }
function download(name, text, type){
  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- rozliczenia ----------
   Lekcja „płatna” = odbyta albo odwołana z opłatą.
   Lekcja grupowa: cena jest od osoby, płaci każdy obecny (przy „odwołanej z opłatą” – każdy z grupy).
   Saldo ucznia = saldo początkowe + wpłaty − płatne lekcje. Ujemne = winien, dodatnie = nadpłata. */
const isCharged = l => l.status === 'done' || l.status === 'late';
function members(l){
  if(!l.groupId) return [l.studentId];
  if(l.attendance) return Object.keys(l.attendance);
  return (group(l.groupId)?.memberIds || []).slice();
}
function chargesOf(l){
  if(!isCharged(l)) return [];
  if(!l.groupId) return [{sid:l.studentId, amount:+l.price}];
  const ids = l.attendance && l.status === 'done' ? Object.keys(l.attendance).filter(k => l.attendance[k]) : members(l);
  return ids.map(sid => ({sid, amount:+l.price}));
}
function value(e){
  if(isCharged(e)) return round2(chargesOf(e).reduce((a, c) => a + c.amount, 0));
  return round2(+e.price * (e.groupId ? members(e).length : 1));
}
function balance(sid){
  const s = student(sid);
  let b = +(s?.openingBalance || 0);
  for(const p of db.payments) if(p.studentId === sid) b += +p.amount;
  for(const l of db.lessons) for(const c of chargesOf(l)) if(c.sid === sid) b -= c.amount;
  return round2(b);
}
function balanceBadge(b){
  if(b < 0) return `<span class="badge bad">winien ${zl(-b)}</span>`;
  if(b > 0) return `<span class="badge ok">nadpłata ${zl(b)}</span>`;
  return `<span class="badge gray">rozliczony</span>`;
}
const involves = (e, sid) => e.studentId === sid || (!!e.groupId && members(e).includes(sid));

/* ---------- stały plan → terminy w kalendarzu ----------
   Terminy z planu są „wirtualne”, dopóki ich nie potwierdzisz/zmienisz – wtedy zapisuje się
   prawdziwa lekcja z tym samym kluczem (slotKey), a wirtualny termin znika. */
const vcache = new Map();
function slotKey(kind, id, date, time){ return `${kind === 'g' ? 'g:' : ''}${id}|${date}|${time}`; }
function owners(){ return [...db.students.map(o => ({o, k:'s'})), ...db.groups.map(o => ({o, k:'g'}))]; }
function virtualOcc(from, to, only){
  const used = new Set(db.lessons.filter(l => l.slotKey).map(l => l.slotKey));
  const out = [];
  for(const {o, k} of owners()){
    if(o.archived || !o.schedule?.length) continue;
    if(only && (only.k !== k || only.id !== o.id)) continue;
    const start = o.scheduleFrom || '2000-01-01';
    const a = from > start ? from : start;
    const b = o.scheduleTo && o.scheduleTo < to ? o.scheduleTo : to;
    if(a > b) continue;
    for(const it of o.schedule){
      const dur = +it.duration || +db.settings.defaultDuration;
      for(let d = addDays(a, ((+it.day) - weekday(a) + 7) % 7); d <= b; d = addDays(d, 7)){
        if((+it.every || 1) === 2 && (daysBetween(weekStart(o.anchor || start), weekStart(d)) / 7) % 2 !== 0) continue;
        const key = slotKey(k, o.id, d, it.time);
        if(used.has(key)) continue;
        const v = {kind:'virtual', studentId:k === 's' ? o.id : null, groupId:k === 'g' ? o.id : null,
                   date:d, time:it.time, duration:dur, price:priceFor(k, o.id, dur), status:'planned', slotKey:key, note:''};
        vcache.set(key, v); out.push(v);
      }
    }
  }
  return out;
}
function events(from, to, filter){
  const real = db.lessons.filter(l => l.date >= from && l.date <= to).map(l => ({...l, kind:'lesson'}));
  let all = [...real, ...virtualOcc(from, to)];
  if(filter) all = all.filter(filter);
  return all.sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
}
function sumEvents(evs, mode){
  let t = 0;
  for(const e of evs){ if(isCharged(e) || (mode === 'forecast' && e.status === 'planned')) t += value(e); }
  return round2(t);
}
const endMin = e => toMin(e.time) + (+e.duration);
const ended = e => { const t = today(); return e.date < t || (e.date === t && endMin(e) <= nowMin()); };
function toConfirm(){ const t = today(); return events(addDays(t, -90), t).filter(e => e.status === 'planned' && ended(e)); }
const paymentsIn = (from, to) => db.payments.filter(p => p.date >= from && p.date <= to);
const sumAmt = arr => round2(arr.reduce((a, p) => a + (+p.amount), 0));
function scheduleWeekly(){
  let amount = 0, count = 0;
  for(const {o, k} of owners()){
    if(o.archived || (o.scheduleTo && o.scheduleTo < today())) continue;
    const heads = k === 'g' ? (o.memberIds || []).length : 1;
    for(const it of o.schedule || []){
      const f = (+it.every || 1) === 2 ? 0.5 : 1;
      amount += priceFor(k, o.id, +it.duration) * heads * f; count += f;
    }
  }
  return {amount:round2(amount), count};
}
function findEvent(ds){
  if(ds.id){ const l = db.lessons.find(x => x.id === ds.id); return l ? {...l, kind:'lesson'} : null; }
  if(ds.slot){
    if(!vcache.has(ds.slot)){ const d = ds.slot.split('|')[1]; if(d) virtualOcc(d, d); }
    return vcache.get(ds.slot) || null;
  }
  return null;
}
function materialize(v, patch){
  const l = {id:uid(), studentId:v.studentId || null, groupId:v.groupId || null, date:v.date, time:v.time, duration:+v.duration,
             price:+v.price, status:'planned', note:'', slotKey:v.slotKey || null, ...patch};
  db.lessons.push(l);
  return l;
}
function freezePast(k, id){
  const t = today();
  for(const v of virtualOcc(addDays(t, -90), t, {k, id})) if(ended(v)) materialize(v, {});
}
function allPresent(gid){ return Object.fromEntries((group(gid)?.memberIds || []).map(id => [id, true])); }
function applyQuick(ev, how, attendance){
  const l = ev.kind === 'lesson' ? db.lessons.find(x => x.id === ev.id) : materialize(ev, {});
  if(!l) return;
  l.status = how === 'cancel' ? 'cancelled' : how === 'late' ? 'late' : 'done';
  if(l.groupId) l.attendance = attendance || l.attendance || allPresent(l.groupId);
  if(['cash','transfer','blik'].includes(how)){
    for(const c of chargesOf(l)) if(c.amount > 0) db.payments.push({id:uid(), studentId:c.sid, date:l.date, amount:c.amount, method:how,
      note:'Za lekcję ' + fmtDateShort(l.date), lessonId:l.id});
  }
  save();
  const msg = {done:'Lekcja odbyta', cash:'Odbyta + gotówka', transfer:'Odbyta + przelew', blik:'Odbyta + BLIK', cancel:'Lekcja odwołana', late:'Odwołana z opłatą'}[how];
  toast(msg + ' · ' + oname(l));
}

/* ---------- stan widoku ---------- */
const state = {
  tab:(() => { try{ return sessionStorage.getItem('kor.tab') || 'home'; }catch(e){ return 'home'; } })(),
  calDate:today(), studentId:null, groupId:null, seg:'students', subject:'', sort:'name',
  finMonth:today().slice(0, 7), showArchived:false, search:''
};
if(!['home','students','cal','fin','set'].includes(state.tab)) state.tab = 'home';

/* ---------- elementy wspólne ---------- */
function statusBadge(e){
  if(e.status === 'done') return `<span class="badge ok">odbyta</span>`;
  if(e.status === 'late') return `<span class="badge warn">odwołana z opłatą</span>`;
  if(e.status === 'cancelled') return `<span class="badge gray">odwołana</span>`;
  if(ended(e)) return `<span class="badge warn">do potwierdzenia</span>`;
  return '';
}
const evAttrs = e => e.kind === 'lesson' ? `data-id="${esc(e.id)}"` : `data-slot="${esc(e.slotKey)}"`;
function quickBtns(e){
  const a = evAttrs(e);
  return `<div class="qa">
    <button class="g" data-act="quick" data-how="done" ${a}>${ic('check')}Odbyta</button>
    <button class="g" data-act="quick" data-how="cash" ${a}>${ic('cash')}Gotówka</button>
    <button data-act="quick" data-how="transfer" ${a}>Przelew</button>
    <button class="r" data-act="quick" data-how="cancel" ${a}>${ic('x')}Odwołana</button>
  </div>`;
}
function lessonCard(e, o = {}){
  const sub = [osubject(e), e.groupId ? `grupa · ${members(e).length} os.` : ''].filter(Boolean).join(' · ');
  return `<div class="lesson ${e.kind} st-${e.status}" style="--c:${esc(ocolor(e))}" data-act="openEvent" ${evAttrs(e)}>
    <div class="grow">
      <div class="row"><div class="t">${o.date ? fmtDateShort(e.date) + ' · ' : ''}${e.time} – ${fromMin(endMin(e))}</div><span class="grow"></span>${trialBadge(e)} ${statusBadge(e)}</div>
      <div class="row"><div class="lname ell grow">${esc(oname(e))}</div>${e.studentId && !o.noBalance ? (b => b ? balanceBadge(b) : '')(balance(e.studentId)) : ''}</div>
      <div class="row small muted"><span class="ell">${esc(sub)}</span><span class="grow"></span><b class="num" style="color:var(--text)">${zl(value(e))}</b></div>
      ${o.actions ? quickBtns(e) : ''}
    </div></div>`;
}
function ownerOptions(sel){
  const st = db.students.filter(s => !s.archived || 's:' + s.id === sel).sort(byName);
  const gr = db.groups.filter(g => !g.archived || 'g:' + g.id === sel).sort(byName);

function notifications(){
  const conf = toConfirm();

  const bd = db.settings.lastBackup ? daysBetween(db.settings.lastBackup.slice(0, 10), today()) : null;

  return {conf, debtors, backup, bd, count:conf.length + (backup ? 1 : 0)};

/* ---------- GRAFIK ---------- */
function viewCal(){
  const d = state.calDate, ws = weekStart(d), we = addDays(ws, 6), t = today();
  setBar(`<button class="bar-btn txt" data-act="calToday">Dziś</button>`, 'Kalendarz',
         `<button class="bar-btn" data-act="addLesson" data-date="${d}" aria-label="Dodaj lekcję">${ic('plus')}</button>`);
  const wEv = events(ws, we);
  const dEv = wEv.filter(e => e.date === d);
  const label = parse(ws).getMonth() === parse(we).getMonth()
    ? `${parse(ws).getDate()} — ${parse(we).getDate()} ${MONTHS[parse(we).getMonth()]}`
    : `${parse(ws).getDate()} ${MONTHS_SHORT[parse(ws).getMonth()]} — ${parse(we).getDate()} ${MONTHS_SHORT[parse(we).getMonth()]}`;
  const days = [0,1,2,3,4,5,6].map(i => {
    const day = addDays(ws, i), c = wEv.filter(e => e.date === day && e.status !== 'cancelled').length;
    return `<button class="dbtn ${day === d ? 'on' : ''} ${day === t ? 'today' : ''}" data-act="calDay" data-date="${day}">
      ${c ? `<span class="cnt">${c}</span>` : ''}<span class="dn">${DAYS_SHORT[i]}</span><span class="dd">${parse(day).getDate()}</span></button>`;
  }).join('');

  // oś godzin
  const H = 64;
  let sh = 7, eh = 21;
  for(const e of dEv){ sh = Math.min(sh, Math.floor(toMin(e.time) / 60)); eh = Math.max(eh, Math.ceil(endMin(e) / 60)); }
  sh = Math.max(0, sh); eh = Math.min(24, eh);
  const rows = []; for(let h = sh; h <= eh; h++) rows.push(`<div class="hr" style="top:${(h - sh) * H}px" ${h < eh ? `data-act="addLesson" data-date="${d}" data-time="${pad(h)}:00"` : ''}><span>${pad(h)}:00</span></div>`);
  // nakładające się lekcje dzielą szerokość
  const items = dEv.map(e => ({e, s:toMin(e.time), en:endMin(e)}));
  let cluster = [], cEnd = -1; const clusters = [];
  for(const it of items){ if(it.s >= cEnd && cluster.length){ clusters.push(cluster); cluster = []; } cluster.push(it); cEnd = Math.max(cEnd, it.en); }
  if(cluster.length) clusters.push(cluster);
  for(const c of clusters){
    const lanes = [];
    for(const it of c){ let i = lanes.findIndex(end => end <= it.s); if(i < 0){ i = lanes.length; lanes.push(0); } lanes[i] = it.en; it.lane = i; }
    c.forEach(it => it.lanes = lanes.length);
  }
  const blocks = items.map(({e, s, en, lane, lanes}) => {
    const top = (s - sh * 60) / 60 * H, height = Math.max(30, (en - s) / 60 * H - 3);
    const w = `((100% - 58px) / ${lanes})`;
    return `<div class="blk ${e.kind === 'virtual' ? 'virtual' : ''} st-${e.status}" style="--c:${esc(ocolor(e))};top:${top + 1}px;height:${height}px;left:calc(58px + ${w} * ${lane});width:calc(${w} - 4px)" data-act="openEvent" ${evAttrs(e)}>
      ${isCharged(e) ? `<span class="ok">${ic('check')}</span>` : ''}
      <b>${esc(oname(e))}</b>
      ${height > 50 ? `<div class="s">${esc(osubject(e) || (e.groupId ? 'Grupa' : ''))}</div>` : ''}
      <div class="s">${e.time} – ${fromMin(en)}${e.trial ? (e.trial === 'free' ? ' · próbna darmowa' : ' · próbna') : ''}${e.status === 'planned' && ended(e) ? ' · do potwierdzenia' : ''}</div></div>`;
  }).join('');
  const nowLine = d === t && nowMin() >= sh * 60 && nowMin() <= eh * 60 ? `<div class="now" style="top:${(nowMin() - sh * 60) / 60 * H}px"></div>` : '';
  const act = dEv.filter(e => e.status !== 'cancelled');

  return `<div class="weekbar">
      <button data-act="calNav" data-dir="-1" aria-label="Poprzedni tydzień">${ic('left')}</button>
      <h2>${label}</h2>
      <button data-act="calNav" data-dir="1" aria-label="Następny tydzień">${ic('right')}</button>
    </div>
    <div class="days">${days}</div>
    <div class="daysum">${DAYS[weekday(d)]}, ${fmtDate(d)} · ${act.length ? `${act.length} lekcji · ${hours(act.reduce((a, e) => a + (+e.duration), 0))} · ${zl(sumEvents(dEv, 'forecast'))}` : 'brak lekcji'}
      <br>Tydzień: ${wEv.filter(e => e.status !== 'cancelled').length} lekcji · prognoza ${zl(sumEvents(wEv, 'forecast'))}</div>
    <div class="tl" style="height:${(eh - sh) * H + 20}px">${rows.join('')}${blocks}${nowLine}</div>
    <p class="hint">Dotknij pustej godziny, aby dodać lekcję. Przerywana ramka = termin ze stałego planu.</p>`;
}

/* ---------- FINANSE ---------- */
// Przychód przeniesiony z poprzedniej aplikacji (kwota za miesiąc, bez szczegółów lekcji)
const carryFor = ym => db.carry.filter(c => c.month === ym);
const carryAmt = ym => round2(carryFor(ym).reduce((a, c) => a + (+c.amount || 0), 0));
const carryLessons = ym => carryFor(ym).reduce((a, c) => a + (+c.lessons || 0), 0);
const carryYear = y => round2(db.carry.filter(c => c.month.startsWith(y)).reduce((a, c) => a + (+c.amount || 0), 0));
// Szacunek lekcji poza stałym planem (zł/tydzień) – tylko na dni od dziś do końca okresu
function extraFor(from, to){
  const w = +db.settings.extraWeekly || 0;
  const a = from > today() ? from : today();
  if(!w || a > to) return 0;
  return round2(w * (daysBetween(a, to) + 1) / 7);
}
function monthEarned(ym){
  const ms = ym + '-01', me = monthEnd(ms);
  return round2(db.lessons.filter(l => l.date >= ms && l.date <= me && isCharged(l)).reduce((a, l) => a + value(l), 0) + carryAmt(ym));
}
function viewFin(){
  setBar('', 'Finanse', `<button class="bar-btn" data-act="addPayment" aria-label="Dodaj wpłatę">${ic('plus')}</button>`);
  const ym = state.finMonth, ms = ym + '-01', me = monthEnd(ms), t = today();
  const mName = MONTHS[+ym.slice(5) - 1];
  const evs = events(ms, me);
  const nonCancelled = evs.filter(e => e.status !== 'cancelled');
  const charged = evs.filter(isCharged);
  const carry = carryAmt(ym), carryN = carryLessons(ym);
  const inApp = sumEvents(evs, 'forecast'), extraM = extraFor(ms, me);
  const earned = round2(sumEvents(evs, 'earned') + carry), forecast = round2(inApp + carry + extraM);
  const pays = paymentsIn(ms, me), received = sumAmt(pays);
  const confList = toConfirm(), confN = confList.length, confSum = sumEvents(confList, 'forecast');
  const wsT = weekStart(t), weekPays = paymentsIn(wsT, addDays(wsT, 6)), isCurMonth = ym === t.slice(0, 7);
  const doneN = charged.length + carryN, allN = nonCancelled.length + carryN;
  const pct = allN ? Math.round(doneN / allN * 100) : 0;
  const bals = db.students.map(s => ({s, b:balance(s.id)}));
  const debtors = bals.filter(x => x.b < 0), over = bals.filter(x => x.b > 0);
  const debt = round2(debtors.reduce((a, x) => a - x.b, 0)), overSum = round2(over.reduce((a, x) => a + x.b, 0));
  const sw = scheduleWeekly();
  const f7 = round2(sumEvents(events(t, addDays(t, 6)), 'forecast') + extraFor(t, addDays(t, 6)));
  const f14 = round2(sumEvents(events(t, addDays(t, 13)), 'forecast') + extraFor(t, addDays(t, 13)));
  const nms = shiftMonth(t.slice(0, 7), 1);
  const fNext = round2(sumEvents(events(nms + '-01', monthEnd(nms + '-01')), 'forecast') + extraFor(nms + '-01', monthEnd(nms + '-01')));

  const endYm = ym > t.slice(0, 7) ? ym : t.slice(0, 7);
  const months = []; for(let i = 5; i >= 0; i--) months.push(shiftMonth(endYm, -i));
  const data = months.map(m => ({m, e:monthEarned(m), p:sumAmt(paymentsIn(m + '-01', monthEnd(m + '-01')))}));
  const max = Math.max(1, ...data.map(x => Math.max(x.e, x.p)));

  const past = evs.filter(e => ended(e));
  const pDone = past.filter(e => e.status === 'done').length, pLate = past.filter(e => e.status === 'late').length;
  const trials = evs.filter(e => e.trial && e.status !== 'cancelled'), trialsFree = trials.filter(e => e.trial === 'free').length;
  const pCanc = past.filter(e => e.status === 'cancelled').length, pOpen = past.filter(e => e.status === 'planned').length;
  const pAll = past.length || 1;

  const methods = Object.keys(METHODS).map(k => ({k, v:sumAmt(pays.filter(p => p.method === k))}));
  const mMax = Math.max(1, ...methods.map(x => x.v));

  const rows = db.students.map(s => {
    let n = 0, mins = 0, e = 0;
    for(const l of charged){ const c = chargesOf(l).find(x => x.sid === s.id); if(c){ n++; mins += +l.duration; e += c.amount; } }
    return {s, n, mins, e:round2(e), paid:sumAmt(pays.filter(p => p.studentId === s.id))};
  }).filter(r => r.n || r.paid).sort((a, b) => b.e - a.e);
  const year = ym.slice(0, 4);
  const yPays = db.payments.filter(p => p.date.startsWith(year));
  const yEarned = round2(db.lessons.filter(l => l.date.startsWith(year) && isCharged(l)).reduce((a, l) => a + value(l), 0) + carryYear(year));

  return `<div class="monthbar">
      <button data-act="finNav" data-dir="-1" aria-label="Poprzedni miesiąc">${ic('left')}</button><b>${monthLabel(ym)}</b>
      <button data-act="finNav" data-dir="1" aria-label="Następny miesiąc">${ic('right')}</button></div>
    <div class="fhero">
      <div class="lbl">Przeprowadzono lekcji za ${mName}</div>
      <div class="big">${doneN}<small>/${allN}</small></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="fgrid">
        <div><div class="l">Przepracowano</div><div class="v">${zl2(earned)}</div><div class="s">${carry ? `w tym ${zl(carry)} z poprzedniej aplikacji` : 'odbyte lub odwołane z opłatą'}</div></div>
        <div><div class="l">Otrzymano ogółem</div><div class="v">${zl2(received)}</div>
          <div class="s">${isCurMonth ? `w tym tygodniu: <b>${zl(sumAmt(weekPays))}</b><br>` : ''}gotówką: ${zl(methods[0].v)}</div></div>
      </div>
    </div>
    <div class="rowcard" data-act="debtors">${ic('alert')}<div class="grow"><b style="font-size:18px">Zadłużenie</b><div class="muted small">Uczniów: ${debtors.length}</div>${confN ? `<div class="small" style="color:var(--warn);white-space:nowrap">+ ${confN} do potw.</div>` : ''}</div><div class="v ${debt ? 'neg' : ''}">${zl2(debt)}</div>${ic('right')}</div>
    ${over.length ? `<div class="rowcard" data-act="debtors" data-over="1">${ic('cash')}<div class="grow"><b style="font-size:18px">Nadpłaty</b><div class="muted small">Uczniów: ${over.length}</div></div><div class="v pos">${zl2(overSum)}</div>${ic('right')}</div>` : ''}

    <div class="sec">Prognoza przychodu</div>
    <div class="card">
      <div class="muted small">${mName} – szacunek całego miesiąca</div>
      <div style="font-size:28px;font-weight:800" class="num">≈ ${zl(forecast)}</div>
      <div class="small muted" style="margin-top:6px;line-height:1.6">
        ${carry ? `• z poprzedniej aplikacji: <b>${zl(carry)}</b><br>` : ''}
        • lekcje w aplikacji (odbyte + zaplanowane): <b>${zl(inApp)}</b><br>
        ${extraM ? `• poza stałym planem (szacunek): <b>${zl(extraM)}</b><br>` : ''}
      </div>
      ${!carry && !db.settings.extraWeekly ? `<div class="hint">Wynik zaniża miesiąc, jeśli część lekcji była w innej aplikacji albo masz uczniów bez stałego terminu – uzupełnisz to w <a href="#" data-act="tab" data-tab="set">Ustawieniach → Prognoza</a>.</div>` : ''}
      <div class="stat3">
        <div><div class="l">7 dni</div><div class="v">${zl(f7)}</div></div>
        <div><div class="l">2 tygodnie</div><div class="v">${zl(f14)}</div></div>
        <div><div class="l">${MONTHS[+nms.slice(5) - 1]}</div><div class="v">${zl(fNext)}</div></div>
      </div>
      <div class="hint">Stały plan: <b>${zl(sw.amount)}</b>${db.settings.extraWeekly ? ` + ok. ${zl(db.settings.extraWeekly)} poza planem` : ''} / tydzień · ${zl(sw.amount * 2)} / 2 tygodnie · ≈ ${zl(sw.amount * 52 / 12)} / miesiąc (${String(sw.count).replace('.', ',')} lekcji w tygodniu)</div>
    </div>

    <div class="sec">Dynamika dochodu</div>
    <div class="card">
      <div class="muted small">Dotknij miesiąca, aby go wybrać</div>
      <div class="chart">${data.map(x => `<div class="ccol ${x.m === ym ? 'on' : ''}" data-act="finMonth" data-m="${x.m}">
          <div class="cval">${x.e ? nf.format(Math.round(x.e)) : ''}</div>
          <div class="cbars"><div class="cbar" style="height:${x.e / max * 100}%"></div><div class="cbar b" style="height:${x.p / max * 100}%"></div></div>
          <div class="clbl">${MONTHS_SHORT[+x.m.slice(5) - 1]}</div></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>przepracowano</span><span><i style="background:var(--ok)"></i>otrzymano</span></div>
    </div>

    <div class="sec">Obecność i odwołania</div>
    <div class="card">
      <div class="attn"><span class="big">${pDone + pLate}</span><span class="muted">/ ${past.length} lekcji · ${Math.round((pDone + pLate) / pAll * 100)}% odbytych</span></div>
      <div class="prog2"><i style="width:${pDone / pAll * 100}%;background:var(--ok)"></i><i style="width:${pLate / pAll * 100}%;background:#f59e0b"></i><i style="width:${pCanc / pAll * 100}%;background:var(--bad)"></i><i style="width:${pOpen / pAll * 100}%;background:var(--faint)"></i></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>odbyte ${pDone}</span><span><i style="background:#f59e0b"></i>z opłatą ${pLate}</span><span><i style="background:var(--bad)"></i>odwołane ${pCanc}</span>${pOpen ? `<span><i style="background:var(--faint)"></i>niepotwierdzone ${pOpen}</span>` : ''}</div>
      ${trials.length ? `<div class="small muted" style="margin-top:10px">Lekcje próbne w tym miesiącu: <b>${trials.length}</b>${trialsFree ? ` (darmowe: ${trialsFree})` : ''}</div>` : ''}
    </div>

    <div class="sec">Formy płatności</div>
    <div class="card">${methods.map(x => `<div class="mbar"><span class="lbl">${METHODS[x.k]}</span><span class="track"><i style="width:${x.v / mMax * 100}%;background:${METHOD_COLORS[x.k]}"></i></span><span class="amt">${zl(x.v)}</span></div>`).join('')}</div>

    <div class="sec">Według uczniów</div>
    <div class="card" style="padding:4px 14px">${rows.length ? rows.map(r => `<div class="lrow" data-act="openStudent" data-id="${esc(r.s.id)}">
        <div class="dot" style="--c:${esc(r.s.color)}"></div>
        <div class="grow"><div class="ell">${esc(r.s.name)}</div><div class="tiny muted">${r.n} lekcji · ${hours(r.mins)} · wpłacił ${zl(r.paid)}</div></div>
        <div class="amount">${zl(r.e)}</div></div>`).join('') : '<div class="empty">Brak danych w tym miesiącu</div>'}</div>

    <div class="sec">Wpłaty <button class="more" data-act="addPayment">+ Dodaj</button></div>
    <div class="card" style="padding:4px 14px">${pays.length ? pays.slice().sort((a, b) => b.date.localeCompare(a.date)).map(p => `<div class="lrow" data-act="editPayment" data-id="${esc(p.id)}">
        <div class="dot" style="--c:${METHOD_COLORS[p.method] || '#999'}"></div>
        <div class="grow"><div class="ell">${esc(sname(p.studentId))}</div><div class="tiny muted">${fmtDateShort(p.date)} · ${METHODS[p.method] || p.method}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
        <div class="amount pos">${zl(p.amount)}</div></div>`).join('') : '<div class="empty">Brak wpłat w tym miesiącu</div>'}</div>

    <div class="sec">Rok ${year}</div>
    <div class="card"><div class="stat3" style="margin:0">
      <div><div class="l">Przepracowano</div><div class="v">${zl(yEarned)}</div></div>
      <div><div class="l">Otrzymano</div><div class="v">${zl(sumAmt(yPays))}</div></div>
      <div><div class="l">Gotówką</div><div class="v">${zl(sumAmt(yPays.filter(p => p.method === 'cash')))}</div></div></div></div>`;
}

const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(state.tab === 'set') render(); });

    <div class="sec">Domyślne wartości</div>

        <label>Długość lekcji (min)<input name="defaultDuration" type="number" inputmode="numeric" step="5" min="15" value="${esc(st.defaultDuration)}"></label>

      <button class="btn primary">Zapisz</button>

    <div class="sec">Kopia zapasowa</div>

      <div class="small muted">Dane są zapisane tylko na tym urządzeniu. Rób regularnie kopię do pliku (np. na Dysk Google lub iCloud) – tym plikiem przeniesiesz też dane na nowy telefon.</div>

function scheduleFields(o){
  return `<div>
      <div class="row" style="margin-bottom:8px"><b class="small">Stały plan lekcji</b><span class="grow"></span><button type="button" class="btn sm" data-act="addSchedRow">${ic('plus')}termin</button></div>
      <div id="schedRows">${(o.schedule || []).map(schedRow).join('')}</div>
      <div class="f2" style="margin-top:4px">
        <label>Plan obowiązuje od<input name="scheduleFrom" type="date" value="${esc(o.scheduleFrom || today())}"></label>
        <label>do (opcjonalnie)<input name="scheduleTo" type="date" value="${esc(o.scheduleTo || '')}"></label>
      </div>
      <div class="hint">Puste = lekcje nieregularne, dodajesz je ręcznie. „Co 2 tyg.” liczy się od tygodnia daty „od”.</div>
    </div>`;
}
function readSchedule(f){
  const fd = new FormData(f);
  const days = fd.getAll('sday'), times = fd.getAll('stime'), durs = fd.getAll('sdur'), every = fd.getAll('severy');
  return days.map((d, i) => ({day:+d, time:times[i], duration:+durs[i], every:+every[i]})).filter(x => x.time);
}
// Zmiana planu: minione niepotwierdzone terminy zostają, nowy plan działa od dziś.
function applyScheduleChange(o, k, data){
  const changed = JSON.stringify(o.schedule || []) !== JSON.stringify(data.schedule) || (o.scheduleFrom || '') !== data.scheduleFrom || (o.scheduleTo || '') !== data.scheduleTo;
  if(!changed) return;
  freezePast(k, o.id);
  if(data.scheduleFrom !== (o.scheduleFrom || '')) data.anchor = data.scheduleFrom;
  else if(data.scheduleFrom < today()){ data.anchor = o.anchor || o.scheduleFrom; data.scheduleFrom = today(); }
}

const forms = {
  trial(f){
    const v = Object.fromEntries(new FormData(f));
    const name = v.name.trim();
    let s = db.students.find(x => x.name.trim().toLowerCase() === name.toLowerCase());
    const dur = +v.duration || 60, free = v.trial === 'free';
    const price = free ? 0 : round2(+v.price || 0);
    if(!s){
      s = {id:uid(), created:new Date().toISOString(), archived:false, trial:true, name, phone:(v.phone || '').trim(), email:'', parentName:'', parentPhone:'',
           subject:(v.subject || '').trim(), level:'', rate:free ? db.settings.defaultRate : round2(price * 60 / dur), color:PALETTE[db.students.length % PALETTE.length],
           notes:'', schedule:[], scheduleFrom:today(), scheduleTo:'', openingBalance:0};
      db.students.push(s);
    }else if(v.phone && !s.phone) s.phone = v.phone.trim();
    const l = materialize({studentId:s.id, date:v.date, time:v.time, duration:dur, price, slotKey:null},
                          {status:v.done || v.paidCash ? 'done' : 'planned', trial:free ? 'free' : 'paid', note:v.note || ''});
    if(v.paidCash && !free && price > 0) db.payments.push({id:uid(), studentId:s.id, date:l.date, amount:price, method:'cash', note:'Lekcja próbna', lessonId:l.id});
    save(); closeModal(); render(); toast(`Lekcja próbna ${free ? '(darmowa) ' : ''}· ${s.name}`);
  },
  student(f){
    const v = Object.fromEntries(new FormData(f));
    const data = {name:v.name.trim(), phone:v.phone.trim(), email:v.email.trim(), parentName:v.parentName.trim(), parentPhone:v.parentPhone.trim(),
                  subject:v.subject.trim(), level:v.level.trim(), rate:v.rate === '' ? '' : +v.rate, color:v.color, notes:v.notes,
                  schedule:readSchedule(f), scheduleFrom:v.scheduleFrom || today(), scheduleTo:v.scheduleTo || '', openingBalance:+v.openingBalance || 0,
                  trial:!!v.trialStudent};
    if(f.dataset.id){ const s = student(f.dataset.id); applyScheduleChange(s, 's', data); Object.assign(s, data); toast('Zapisano'); }
    else{ db.students.push({id:uid(), created:new Date().toISOString(), archived:false, ...data}); toast('Dodano ucznia'); }
    save(); closeModal(); render();
  },
  group(f){
    const fd = new FormData(f), v = Object.fromEntries(fd);
    const data = {name:v.name.trim(), subject:v.subject.trim(), rate:v.rate === '' ? '' : +v.rate, color:v.color, notes:v.notes,
                  memberIds:fd.getAll('member'), schedule:readSchedule(f), scheduleFrom:v.scheduleFrom || today(), scheduleTo:v.scheduleTo || ''};
    if(f.dataset.id){ const g = group(f.dataset.id); applyScheduleChange(g, 'g', data); Object.assign(g, data); toast('Zapisano grupę'); }
    else{ db.groups.push({id:uid(), created:new Date().toISOString(), archived:false, ...data}); toast('Utworzono grupę'); }
    state.seg = 'groups';
    save(); closeModal(); render();
  },
  lesson(f){
    const v = Object.fromEntries(new FormData(f));
    const [k, id] = v.owner.split(':');
    const data = {studentId:k === 's' ? id : null, groupId:k === 'g' ? id : null, date:v.date, time:v.time, duration:+v.duration,
                  price:v.trial === 'free' ? 0 : +v.price, status:v.paidCash ? 'done' : v.status, note:v.note, trial:v.trial || ''};
    if(k === 'g'){
      const box = f.querySelectorAll('input[name=att]');
      data.attendance = box.length ? Object.fromEntries([...box].map(c => [c.value, c.checked])) : allPresent(id);
    }else data.attendance = null;
    let l;
    if(f.dataset.id){ l = db.lessons.find(x => x.id === f.dataset.id); Object.assign(l, data); }
    else if(f.dataset.slot){ l = materialize(findEvent({slot:f.dataset.slot}), data); }
    else l = materialize({...data, slotKey:null}, data);
    if(v.paidCash) for(const c of chargesOf(l)) if(c.amount > 0) db.payments.push({id:uid(), studentId:c.sid, date:l.date, amount:c.amount, method:'cash', note:'Za lekcję ' + fmtDateShort(l.date), lessonId:l.id});
    save(); closeModal(); render(); toast('Zapisano lekcję');
  },
  payment(f){
    const v = Object.fromEntries(new FormData(f));
    const data = {studentId:v.studentId, date:v.date, amount:round2(+v.amount), method:v.method, note:v.note.trim()};
    if(f.dataset.id) Object.assign(db.payments.find(p => p.id === f.dataset.id), data);
    else db.payments.push({id:uid(), ...data});
    save(); closeModal(); render(); toast('Zapisano wpłatę: ' + zl(data.amount));
  },
  forecast(f){
    const v = Object.fromEntries(new FormData(f));
    db.settings.extraWeekly = +v.extraWeekly || 0;
    if(v.cMonth && v.cAmount !== ''){

    }
    save(); render(); toast('Zapisano – prognoza zaktualizowana');
  },
  settings(f){
    const v = Object.fromEntries(new FormData(f));
    db.settings.defaultRate = +v.defaultRate || 0;
    db.settings.defaultDuration = +v.defaultDuration || 60;
    save(); render(); toast('Zapisano ustawienia');
  }
};

function decodeB64(b64){
  b64 = b64.replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
  while(b64.length % 4) b64 += '=';
  return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
}
// Format tekstowy (odporny na ucięcie przy kopiowaniu), np.:
//   UCZEŃ: Jan Kowalski; 70; Matematyka
//   WPŁATY
//   Jan Kowalski; 70; 6.11.2026; gotówka; notatka
function parseDatePL(t){
  t = String(t || '').trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = t.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?$/);
  if(m){ let y = m[3] ? +m[3] : new Date().getFullYear(); if(y < 100) y += 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  return '';
}
function methodKey(t){
  t = String(t || '').trim().toLowerCase();
  if(!t) return 'other';
  if(t.startsWith('got')) return 'cash';
  if(t.startsWith('prze')) return 'transfer';
  if(t.startsWith('blik')) return 'blik';
  return 'other';
}
function parseTextImport(txt){
  const students = [], payments = [], lessons = [], carry = [], bad = []; let extraWeekly = null;
  for(let line of txt.split(/\r?\n/)){
    line = line.trim();
    if(!line || /^WP[ŁL]ATY:?$/i.test(line)) continue;
    const mc = line.match(/^PRZYCH[ÓO]D\s*:\s*(.+)$/i);
    if(mc){
      const [mon, amt, n] = mc[1].split(';').map(x => x.trim());
      const mm = String(mon || '').match(/^(\d{1,2})[.\/-](\d{4})$/) || String(mon || '').match(/^(\d{4})-(\d{1,2})$/);
      const month = mm ? (mm[2].length === 4 ? `${mm[2]}-${pad(+mm[1])}` : `${mm[1]}-${pad(+mm[2])}`) : '';
      const amount = +String(amt || '').replace(/z[łl]/i, '').replace(',', '.').trim();
      if(!month || !amount){ bad.push(line); continue; }
      carry.push({month, amount:round2(amount), lessons:+n || 0});
      continue;
    }
    const mx = line.match(/^POZA PLANEM\s*:\s*([\d.,]+)/i);
    if(mx){ extraWeekly = +mx[1].replace(',', '.'); continue; }
    const ml = line.match(/^LEKCJ[AE]\s*:\s*(.+)$/i);
    if(ml){
      const [name, dt, time, price, dur, st] = ml[1].split(';').map(x => x.trim());
      const date = parseDatePL(dt), tm = /^\d{1,2}:\d{2}$/.test(time || '') ? time.padStart(5, '0') : '';
      const pr = +String(price || '').replace(/z[łl]/i, '').replace(',', '.').trim();
      if(!name || !date || !tm){ bad.push(line); continue; }
      const stl = String(st || '').toLowerCase();
      lessons.push({name, date, time:tm, price:!String(price || '').trim() || isNaN(pr) ? null : pr, duration:+dur || 60,
                    trial:/próbn|probn/.test(stl) ? (/darm/.test(stl) ? 'free' : 'paid') : '',
                    status:/odwo|anul/.test(stl) ? (/płatn|platn|opłat|oplat/.test(stl) ? 'late' : 'cancelled') : (/próbn|probn/.test(stl) ? 'done' : /płatn|platn|opłat|oplat/.test(stl) ? 'late' : 'done')});
      continue;
    }
    const m = line.match(/^UCZE[ŃN]\s*:\s*(.+)$/i);
    if(m){
      const [name, rate, subject] = m[1].split(';').map(x => x.trim());
      students.push({name, rate:rate ? +rate.replace(',', '.').replace(/z[łl]/i, '') : undefined, subject:subject || ''});
      continue;
    }
    const [name, amt, dt, method, note] = line.split(';').map(x => x.trim());
    const amount = +String(amt || '').replace(/z[łl]/i, '').replace(',', '.').trim();
    const date = parseDatePL(dt);
    if(!name || !amount || !date){ bad.push(line); continue; }
    payments.push({name, amount, date, method:methodKey(method), note:note || ''});
  }
  if(bad.length) alert('Pominięto niezrozumiałe linijki:\n' + bad.join('\n'));
  return {keepBalance:true, partial:true, students, payments, lessons, carry, extraWeekly};
}
function parseImport(raw){
  raw = raw.trim().replace(/^.*#import=/, '');
  if(/;/.test(raw) || /^(WP[ŁL]ATY|UCZE[ŃN]|LEKCJ)/im.test(raw)) return parseTextImport(raw);
  let txt = raw;
  if(!/^[\[{]/.test(raw)){
    try{ txt = decodeB64(raw); }catch(e){ throw new Error('kod jest uszkodzony – skopiuj go jeszcze raz w całości'); }
  }
  txt = txt.replace(/[\u201C\u201D\u201E]/g, '"');
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error('kod jest niepełny (ucięty przy kopiowaniu) – skopiuj go jeszcze raz w całości, od pierwszego do ostatniego znaku'); }
}
function importStudents(list){
  const have = new Set(db.students.map(s => s.name.trim().toLowerCase()));
  let added = 0, skipped = 0;
  for(const x of list){
    const name = String(x.name || '').trim();
    if(!name || have.has(name.toLowerCase())){ skipped++; continue; }
    have.add(name.toLowerCase());
    db.students.push({
      id:uid(), created:new Date().toISOString(), archived:false, name,
      subject:x.subject || '', level:x.level || '', rate:x.rate ?? db.settings.defaultRate,
      phone:x.phone || '', email:x.email || '', parentName:x.parentName || '', parentPhone:x.parentPhone || '', notes:x.notes || '',
      color:x.color || PALETTE[db.students.length % PALETTE.length], openingBalance:+x.openingBalance || 0,
      schedule:(x.schedule || []).map(it => ({day:+it.day, time:it.time, duration:+it.duration || 60, every:+it.every || 1})),
      // plan od jutra – salda z poprzedniej aplikacji obejmują już dzisiejsze lekcje
      scheduleFrom:x.scheduleFrom || addDays(today(), 1), scheduleTo:''
    });
    added++;
  }
  return {added, skipped};
}
// Wpłaty przeniesione z innej aplikacji: saldo ucznia zostaje bez zmian (keepBalance),
// bo saldo początkowe już je uwzględniało – przesuwamy je o kwotę wpłaty.
function importPayments(list, keepBalance){
  const byName = new Map(db.students.map(s => [s.name.trim().toLowerCase(), s]));
  let added = 0, skipped = 0; const missing = [];
  for(const x of list){
    const s = byName.get(String(x.name || '').trim().toLowerCase());
    if(!s){ missing.push(x.name); continue; }
    const amount = round2(+x.amount), date = String(x.date || '');
    if(!amount || !/^\d{4}-\d{2}-\d{2}$/.test(date)){ skipped++; continue; }
    if(db.payments.some(p => p.studentId === s.id && p.date === date && +p.amount === amount)){ skipped++; continue; }
    db.payments.push({id:uid(), studentId:s.id, date, amount, method:METHODS[x.method] ? x.method : 'other',
                      note:x.note || 'Przeniesione z poprzedniej aplikacji', imported:true});
    if(keepBalance) s.openingBalance = round2((+s.openingBalance || 0) - amount);
    added++;
  }
  return {added, skipped, missing};
}
// Lekcje przeniesione z innej aplikacji: saldo zostaje bez zmian (keepBalance) –
// saldo początkowe już je uwzględniało, więc podnosimy je o cenę płatnej lekcji.
function importLessons(list, keepBalance){
  const byName = new Map(db.students.map(s => [s.name.trim().toLowerCase(), s]));
  let added = 0, skipped = 0; const missing = [];
  for(const x of list){
    const s = byName.get(String(x.name || '').trim().toLowerCase());
    if(!s){ missing.push(x.name); continue; }
    if(db.lessons.some(l => l.studentId === s.id && l.date === x.date && l.time === x.time)){ skipped++; continue; }
    const dur = +x.duration || 60;
    const price = x.trial === 'free' ? 0 : x.price != null ? round2(x.price) : priceFor('s', s.id, dur);
    const l = materialize({studentId:s.id, date:x.date, time:x.time, duration:dur, price, slotKey:null},
                          {status:x.status || 'done', trial:x.trial || '', note:x.note || 'Przeniesione z poprzedniej aplikacji', imported:true});
    if(keepBalance && isCharged(l)) s.openingBalance = round2((+s.openingBalance || 0) + l.price);
    added++;
  }
  return {added, skipped, missing};
}
function runImport(data){
  if(data && !data.partial && Array.isArray(data.lessons) && Array.isArray(data.payments) && Array.isArray(data.students)){
    if(!confirm(`To pełna kopia zapasowa (${data.students.length} uczniów). Obecne dane zostaną ZASTĄPIONE. Kontynuować?`)) return;
    db = normalize(data); save(); render(); toast('Wczytano kopię'); return;
  }
  const list = Array.isArray(data) ? data : (Array.isArray(data?.students) ? data.students : []);
  const pays = Array.isArray(data?.payments) ? data.payments : [];
  const less = data?.partial && Array.isArray(data.lessons) ? data.lessons : [];
  const carry = data?.partial && Array.isArray(data.carry) ? data.carry : [];
  const extra = data?.partial && data.extraWeekly != null ? +data.extraWeekly : null;
  if(!list.length && !pays.length && !less.length && !carry.length && extra == null) throw new Error('nic do zaimportowania');
  if(!list.length && !pays.length && !less.length){
    for(const c of carry){ db.carry = db.carry.filter(x => x.month !== c.month); db.carry.push(c); }
    if(extra != null) db.settings.extraWeekly = extra;
    save(); state.tab = 'fin'; render(); toast('Zapisano – prognoza zaktualizowana'); return;
  }
  const what = [list.length ? `${list.length} uczniów` : '', less.length ? `${less.length} lekcji` : '', pays.length ? `${pays.length} wpłat` : ''].filter(Boolean).join(', ');
  if(!confirm(`Dodać ${what} do aplikacji?`)) return;
  const r = importStudents(list);
  const rp = importPayments(pays, data?.keepBalance !== false);
  const rl = importLessons(less, data?.keepBalance !== false);
  for(const c of carry){ db.carry = db.carry.filter(x => x.month !== c.month); db.carry.push(c); }
  if(extra != null) db.settings.extraWeekly = extra;
  rp.missing.push(...rl.missing.filter(n => !rp.missing.includes(n)));
  save(); state.studentId = state.groupId = null;
  state.tab = (pays.length || less.length) && !list.length ? 'fin' : 'students'; render();
  const msg = [];
  if(list.length) msg.push(`uczniowie: dodano ${r.added}` + (r.skipped ? `, pominięto ${r.skipped}` : ''));
  if(pays.length) msg.push(`wpłaty: dodano ${rp.added}` + (rp.skipped ? `, pominięto ${rp.skipped} (już są)` : ''));
  if(less.length) msg.push(`lekcje: dodano ${rl.added}` + (rl.skipped ? `, pominięto ${rl.skipped} (już są)` : ''));
  toast(msg.join(' · '));
  if(rp.missing.length) alert('Nie znaleziono uczniów: ' + rp.missing.join(', ') + '\nNajpierw dodaj tych uczniów, potem wklej kod jeszcze raz.');
}

/* ---------- przykładowe dane ---------- */
function loadDemo(){
  const t = today(), from = addDays(weekStart(t), -28);
  const mk = (name, subject, level, rate, schedule, extra = {}) => {
    const s = {id:uid(), created:new Date().toISOString(), archived:false, name, subject, level, rate, schedule, scheduleFrom:from, scheduleTo:'',
               color:PALETTE[db.students.length % PALETTE.length], phone:'', email:'', parentName:'', parentPhone:'', notes:'', openingBalance:0, ...extra};
    db.students.push(s); return s;
  };
  const a = mk('Ania Kowalska', 'Matematyka', '8 SP', 80, [{day:1, time:'16:00', duration:60, every:1}, {day:3, time:'17:00', duration:60, every:1}],
               {phone:'600 100 200', parentName:'Pani Kowalska', parentPhone:'600 100 201', notes:'Przygotowanie do egzaminu ósmoklasisty.'});
  const b = mk('Kuba Nowak', 'Fizyka', '2 LO', 100, [{day:2, time:'18:00', duration:90, every:1}], {phone:'601 222 333'});
  const c = mk('Ola Wiśniewska', 'Matematyka', 'matura rozszerzona', 120, [{day:4, time:'15:30', duration:60, every:1}], {phone:'602 444 555', notes:'Płaci z góry za miesiąc.'});
  const d = mk('Michał Zieliński', 'Angielski', '6 SP', 70, [{day:5, time:'10:00', duration:60, every:2}], {phone:'603 666 777'});
  const e1 = mk('Zosia Lis', 'Matematyka', '5 SP', 50, []), e2 = mk('Tymek Wróbel', 'Matematyka', '5 SP', 50, []), e3 = mk('Lena Mazur', 'Matematyka', '5 SP', 50, []);
  const g = {id:uid(), created:new Date().toISOString(), archived:false, name:'5 klasa – grupa', subject:'Matematyka', rate:50, color:'#7c3aed', notes:'',
             memberIds:[e1.id, e2.id, e3.id], schedule:[{day:0, time:'15:00', duration:60, every:1}], scheduleFrom:from, scheduleTo:''};
  db.groups.push(g);
  for(const v of virtualOcc(from, addDays(t, -3))){
    if(v.studentId === b.id && Math.random() < .2){ materialize(v, {status:'cancelled'}); continue; }
    if(v.groupId){
      const att = allPresent(g.id); if(Math.random() < .4) att[e3.id] = false;
      const l = materialize(v, {status:'done', attendance:att});
      for(const ch of chargesOf(l)) if(ch.sid !== e2.id) db.payments.push({id:uid(), studentId:ch.sid, date:l.date, amount:ch.amount, method:'cash', note:'', lessonId:l.id});
      continue;
    }
    const l = materialize(v, {status:'done'});
    if(v.studentId === a.id) db.payments.push({id:uid(), studentId:a.id, date:l.date, amount:l.price, method:'cash', note:'Za lekcję ' + fmtDateShort(l.date), lessonId:l.id});
    if(v.studentId === d.id) db.payments.push({id:uid(), studentId:d.id, date:l.date, amount:l.price, method:'blik', note:'', lessonId:l.id});
  }
  db.payments.push({id:uid(), studentId:b.id, date:addDays(from, 10), amount:300, method:'transfer', note:'za 2 lekcje'});
  db.payments.push({id:uid(), studentId:c.id, date:from, amount:600, method:'transfer', note:'z góry za 5 lekcji'});
  db.payments.push({id:uid(), studentId:c.id, date:monthStart(t), amount:480, method:'cash', note:'z góry'});
  save();
}
