<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Korepetycje">
<title>Korepetycje</title>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--text:#1c1f2e;--muted:#6b7084;--line:#e3e5ee;
  --accent:#4f46e5;--accent-text:#fff;--accent-soft:#eef0ff;
  --ok:#15803d;--ok-bg:#e7f6ec;--bad:#c62828;--bad-bg:#fdecec;--warn:#a15c07;--warn-bg:#fff3dc;
  --shadow:0 1px 2px rgba(20,20,40,.05),0 4px 16px rgba(20,20,40,.05);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1016;--card:#181b25;--text:#e7e9f2;--muted:#9a9fb4;--line:#2a2e3c;
    --accent:#8b93ff;--accent-text:#0e1016;--accent-soft:#252a52;
    --ok:#4ade80;--ok-bg:#13301f;--bad:#f87171;--bad-bg:#3a1818;--warn:#fbbf24;--warn-bg:#3a2b0e;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px}
h3{font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px}

/* layout */
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab .ico{font-size:18px}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 20px 100px}
@media (max-width:760px){
  .top{padding:10px 16px}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));margin:0;gap:0}
  .tab{flex-direction:column;gap:0;font-size:11px;padding:4px 6px;min-width:0}
  .tab .ico{font-size:20px}
  main{padding:14px 16px 130px}
}

/* cards & grid */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.g3,.g2{grid-template-columns:1fr}}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{color:var(--muted);font-size:13px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.pagehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{margin-right:auto}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ok{color:var(--ok)}
.icon-btn{border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--muted);font-size:16px}
.icon-btn:hover{background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fab{position:fixed;right:22px;bottom:24px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(79,70,229,.4);z-index:11}
@media (max-width:760px){.fab{bottom:calc(78px + env(safe-area-inset-bottom));right:16px}}

/* badges */
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.gray{background:var(--line);color:var(--muted)}

/* event rows */
.ev{position:relative;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px;background:var(--card);cursor:pointer;margin-bottom:6px}
.ev:hover{border-color:var(--c)}
.ev.virtual{border-style:dashed;border-left-style:solid}
.ev.st-cancelled{opacity:.55}
.ev.st-cancelled .ev-name{text-decoration:line-through}
.ev-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev-name{font-weight:600}
.ev-meta{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:2px;flex-wrap:wrap}
.ev-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.list .item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:140px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.day-h b{font-size:14px}
.day-h span{font-size:12px;color:var(--muted)}
.day .add{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:8px;color:var(--muted);cursor:pointer;padding:4px;font-size:13px}
.day .add:hover{border-color:var(--accent);color:var(--accent)}
.day .ev{padding:6px 7px}
.day .ev-name{font-size:13px}
.day .badge{white-space:normal}
@media (max-width:900px){
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .day .add{margin-top:4px}
}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mh{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.mc{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:4px;cursor:pointer;overflow:hidden}
.mc.out{opacity:.45}
.mc.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc .n{font-size:12px;font-weight:700;margin-bottom:2px}
.chip{font-size:11px;border-left:3px solid var(--c);padding:1px 4px;margin-bottom:2px;border-radius:3px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.st-cancelled{text-decoration:line-through;opacity:.6}
@media (max-width:600px){.mc{min-height:58px}.chip{font-size:0;height:5px;padding:0;border-left-width:0;background:var(--c);margin-bottom:2px}}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--accent-soft)}
.scroll-x{overflow-x:auto}

/* bars */
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%}
.bar-pair{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
.bar{width:42%;max-width:18px;border-radius:4px 4px 0 0;min-height:1px}
.bar.a{background:var(--accent)}
.bar.b{background:var(--ok)}
.bar-lbl{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* forms & modal */
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,20,.5)}
.mbody{padding:20px;overflow:auto;max-height:calc(100vh - 40px)}
.mhead{display:flex;align-items:center;margin-bottom:14px}
.mhead h2{margin-right:auto}
.f{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:480px){.f3{grid-template-columns:1fr 1fr}}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=color]{padding:2px;height:40px}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
.factions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.factions .left{margin-right:auto}
.sched-row{display:grid;grid-template-columns:1.4fr 1fr .8fr 1.1fr auto;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:480px){.sched-row{grid-template-columns:1fr 1fr;}.sched-row .icon-btn{justify-self:end}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.quick .btn{justify-content:center;white-space:normal;text-align:center;min-width:0}
.menu{display:grid;gap:10px}
.menu .btn{justify-content:flex-start;padding:14px 16px;font-size:16px}
.balance-big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:100;font-size:14px}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){#toast{bottom:calc(150px + env(safe-area-inset-bottom))}}
.search{max-width:260px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">📚 Korepetycje</div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-act="tab" data-tab="dash"><span class="ico">🏠</span><span>Pulpit</span></button>
    <button class="tab" data-act="tab" data-tab="cal"><span class="ico">📅</span><span>Kalendarz</span></button>
    <button class="tab" data-act="tab" data-tab="students"><span class="ico">👥</span><span>Uczniowie</span></button>
    <button class="tab" data-act="tab" data-tab="pay"><span class="ico">💰</span><span>Wpłaty</span></button>
    <button class="tab" data-act="tab" data-tab="rep"><span class="ico">📊</span><span>Raporty</span></button>
    <button class="tab" data-act="tab" data-tab="set"><span class="ico">⚙️</span><span>Ustawienia</span></button>
  </nav>
</header>
<main id="view"></main>
<button class="fab" data-act="quickAdd" aria-label="Dodaj">+</button>
<dialog id="modal"><div class="mbody" id="modalBody"></div></dialog>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   Korepetycje – prosta aplikacja do rozliczania korepetycji.
   Wszystkie dane trzymane są lokalnie w przeglądarce (localStorage).
   ========================================================= */

const KEY = 'korepetycje.v1';
const PALETTE = ['#4f46e5','#0891b2','#16a34a','#ea580c','#db2777','#7c3aed','#ca8a04','#dc2626','#0d9488','#2563eb','#9333ea','#65a30d'];
const DAYS = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
const DAYS_SHORT = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MONTHS_SHORT = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const METHODS = {cash:'Gotówka', transfer:'Przelew', blik:'BLIK', other:'Inne'};
const STATUS = {planned:'Zaplanowane', done:'Odbyte', late:'Odwołane – płatne', cancelled:'Odwołane'};

/* ---------- dane ---------- */
function emptyDb(){
  return {version:1, students:[], lessons:[], payments:[], settings:{defaultRate:80, defaultDuration:60, lastBackup:null}};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw), e = emptyDb();
      return {...e, ...d, settings:{...e.settings, ...(d.settings||{})}};
    }
  }catch(err){ console.error(err); }
  return emptyDb();
}
let db = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('Nie udało się zapisać danych: ' + e.message); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- daty ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const weekday = s => (parse(s).getDay() + 6) % 7;          // 0 = poniedziałek
const weekStart = s => addDays(s, -weekday(s));
const monthStart = s => s.slice(0, 8) + '01';
const monthEnd = s => { const d = parse(monthStart(s)); return ymd(new Date(d.getFullYear(), d.getMonth()+1, 0)); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const toMin = t => { const [h, m] = String(t||'0:0').split(':').map(Number); return h*60 + m; };
const fromMin = m => pad(Math.floor(m/60) % 24) + ':' + pad(m % 60);
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
function shiftMonth(ym, n){ const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function monthLabel(ym){ const [y,m] = ym.split('-').map(Number); return MONTHS[m-1] + ' ' + y; }
function fmtDate(s){ const d = parse(s); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateShort(s){ const d = parse(s); return `${DAYS_SHORT[weekday(s)]} ${d.getDate()}.${pad(d.getMonth()+1)}`; }
function fmtDayMonth(s){ const d = parse(s); return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }

/* ---------- pieniądze ---------- */
const round2 = v => Math.round((+v || 0) * 100) / 100;
const nf = new Intl.NumberFormat('pl-PL', {minimumFractionDigits:0, maximumFractionDigits:2});
const zl = v => nf.format(round2(v)) + ' zł';
const zlSigned = v => (v > 0 ? '+' : '') + zl(v);
const hours = min => { const h = min / 60; return (Math.round(h*10)/10).toString().replace('.', ',') + ' h'; };

/* ---------- pomocnicze ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = sel => document.querySelector(sel);
const student = id => db.students.find(s => s.id === id);
const sname = id => student(id)?.name || '(usunięty uczeń)';
const scolor = id => student(id)?.color || '#888';
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
function rateOf(sid){ const s = student(sid); return s && s.rate !== '' && s.rate != null ? +s.rate : +db.settings.defaultRate; }
function priceFor(sid, dur){ return round2(rateOf(sid) * (+dur || 0) / 60); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
function download(name, text, type){
  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- logika rozliczeń ----------
   Zajęcia „płatne” = odbyte lub odwołane-płatne.
   Saldo ucznia = saldo początkowe + wpłaty − płatne zajęcia.
   Saldo > 0 → nadpłata (uczeń ma „na zapas”), saldo < 0 → uczeń jest winien. */
const isCharged = l => l.status === 'done' || l.status === 'late';
function balance(sid){
  const s = student(sid);
  let b = +(s?.openingBalance || 0);
  for(const p of db.payments) if(p.studentId === sid) b += +p.amount;
  for(const l of db.lessons) if(l.studentId === sid && isCharged(l)) b -= +l.price;
  return round2(b);
}
function balanceBadge(b){
  if(b < 0) return `<span class="badge bad">winien ${zl(-b)}</span>`;
  if(b > 0) return `<span class="badge ok">nadpłata ${zl(b)}</span>`;
  return `<span class="badge gray">rozliczony</span>`;
}

/* ---------- plan stały → wirtualne terminy ----------
   Stały plan ucznia (np. wtorek 17:00) generuje „wirtualne” zajęcia w kalendarzu.
   Gdy potwierdzisz / zmienisz / odwołasz termin, zapisuje się prawdziwy wpis
   z tym samym slotKey, a wirtualny znika. */
const vcache = new Map();
const slotKey = (sid, date, time) => `${sid}|${date}|${time}`;
function virtualOcc(from, to, onlySid){
  const used = new Set(db.lessons.filter(l => l.slotKey).map(l => l.slotKey));
  const out = [];
  for(const s of db.students){
    if(s.archived || !s.schedule?.length) continue;
    if(onlySid && s.id !== onlySid) continue;
    const start = s.scheduleFrom || '2000-01-01';
    const a = from > start ? from : start;
    const b = s.scheduleTo && s.scheduleTo < to ? s.scheduleTo : to;
    if(a > b) continue;
    for(const it of s.schedule){
      const dur = +it.duration || +db.settings.defaultDuration;
      for(let d = addDays(a, ((+it.day) - weekday(a) + 7) % 7); d <= b; d = addDays(d, 7)){
        if((+it.every || 1) === 2){
          const w = daysBetween(weekStart(s.anchor || start), weekStart(d)) / 7;
          if(w % 2 !== 0) continue;
        }
        const key = slotKey(s.id, d, it.time);
        if(used.has(key)) continue;
        const v = {kind:'virtual', studentId:s.id, date:d, time:it.time, duration:dur, price:priceFor(s.id, dur), status:'planned', slotKey:key, note:''};
        vcache.set(key, v);
        out.push(v);
      }
    }
  }
  return out;
}
function events(from, to, onlySid){
  const real = db.lessons
    .filter(l => l.date >= from && l.date <= to && (!onlySid || l.studentId === onlySid))
    .map(l => ({...l, kind:'lesson'}));
  return [...real, ...virtualOcc(from, to, onlySid)]
    .sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
}
// suma: 'earned' – tylko rozliczone (odbyte/płatne), 'forecast' – rozliczone + zaplanowane
function sumEvents(evs, mode){
  let t = 0;
  for(const e of evs){
    if(isCharged(e)) t += +e.price;
    else if(mode === 'forecast' && e.status === 'planned') t += +e.price;
  }
  return round2(t);
}
const ended = e => { const t = today(); return e.date < t || (e.date === t && toMin(e.time) + (+e.duration) <= nowMin()); };
function toConfirm(){ const t = today(); return events(addDays(t, -90), t).filter(e => e.status === 'planned' && ended(e)); }
const paymentsIn = (from, to) => db.payments.filter(p => p.date >= from && p.date <= to);
const sumAmt = arr => round2(arr.reduce((a, p) => a + (+p.amount), 0));
function scheduleWeekly(){
  let amount = 0, count = 0;
  for(const s of db.students){
    if(s.archived) continue;
    if(s.scheduleTo && s.scheduleTo < today()) continue;
    for(const it of s.schedule || []){
      const f = (+it.every || 1) === 2 ? 0.5 : 1;
      amount += priceFor(s.id, +it.duration) * f; count += f;
    }
  }
  return {amount:round2(amount), count};
}
function findEvent(ds){
  if(ds.id){ const l = db.lessons.find(x => x.id === ds.id); return l ? {...l, kind:'lesson'} : null; }
  if(ds.slot) return vcache.get(ds.slot) || null;
  return null;
}
function materialize(v, patch){
  const l = {id:uid(), studentId:v.studentId, date:v.date, time:v.time, duration:+v.duration, price:+v.price,
             status:'planned', note:'', slotKey:v.slotKey || null, ...patch};
  db.lessons.push(l);
  return l;
}
// Zapisuje niepotwierdzone, minione terminy z planu jako prawdziwe wpisy (przed zmianą planu / archiwizacją).
function freezePast(sid){
  const t = today();
  for(const v of virtualOcc(addDays(t, -90), t, sid)) if(ended(v)) materialize(v, {});
}
function applyQuick(ev, how){
  const l = ev.kind === 'lesson' ? db.lessons.find(x => x.id === ev.id) : materialize(ev, {});
  if(!l) return;
  if(how === 'cancel') l.status = 'cancelled';
  else if(how === 'late') l.status = 'late';
  else l.status = 'done';
  if(how === 'cash' || how === 'transfer' || how === 'blik'){
    db.payments.push({id:uid(), studentId:l.studentId, date:l.date, amount:+l.price, method:how,
                      note:'Za zajęcia ' + fmtDateShort(l.date), lessonId:l.id});
  }
  save();
  const msg = {done:'Zapisano jako odbyte', cash:'Odbyte + gotówka', transfer:'Odbyte + przelew', blik:'Odbyte + BLIK', cancel:'Odwołano', late:'Odwołane (płatne)'}[how];
  toast(msg + ' · ' + sname(l.studentId));
}

/* ---------- elementy wspólne ---------- */
function statusBadge(e){
  if(e.status === 'done') return `<span class="badge ok">odbyte</span>`;
  if(e.status === 'late') return `<span class="badge warn">odwołane płatne</span>`;
  if(e.status === 'cancelled') return `<span class="badge gray">odwołane</span>`;
  if(ended(e)) return `<span class="badge warn">do potwierdzenia</span>`;
  return e.kind === 'virtual' ? `<span class="badge">z planu</span>` : `<span class="badge">zaplanowane</span>`;
}
function evAttrs(e){ return e.kind === 'lesson' ? `data-id="${esc(e.id)}"` : `data-slot="${esc(e.slotKey)}"`; }
function evRow(e, o = {}){
  const end = fromMin(toMin(e.time) + (+e.duration));
  const actions = o.actions ? `<div class="ev-actions">
      <button class="btn sm ok" data-act="quick" data-how="done" ${evAttrs(e)}>✓ Odbyte</button>

      <button class="btn sm" data-act="quick" data-how="transfer" ${evAttrs(e)}>✓ + przelew</button>
      <button class="btn sm danger" data-act="quick" data-how="cancel" ${evAttrs(e)}>✕ Odwołane</button>
    </div>` : '';
  return `<div class="ev ${e.kind} st-${e.status}" style="--c:${esc(scolor(e.studentId))}" data-act="openEvent" ${evAttrs(e)}>
    <div class="ev-time">${o.date ? fmtDateShort(e.date) + ' · ' : ''}${e.time}–${end}</div>

    <div class="ev-meta">${statusBadge(e)} <span class="muted">${zl(e.price)}</span></div>
    ${actions}
  </div>`;
}
function stat(lbl, val, sub = '', cls = ''){
  return `<div class="card stat"><div class="lbl">${lbl}</div><div class="val ${cls}">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}
function studentOptions(sel){
  const list = db.students.filter(s => !s.archived || s.id === sel).sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  return list.map(s => `<option value="${esc(s.id)}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
}

/* ---------- PULPIT ---------- */
function viewDash(){
  if(!db.students.length){
    return `<div class="card" style="text-align:center;padding:40px 20px">
      <div style="font-size:44px">📚</div>
      <h2 style="margin:10px 0 8px">Witaj w aplikacji Korepetycje</h2>
      <p class="muted" style="max-width:460px;margin:0 auto 18px">Dodaj pierwszego ucznia ze stałym terminem zajęć – kalendarz, salda i prognozy policzą się same.</p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-act="addStudent">+ Dodaj ucznia</button>
        <button class="btn" data-act="loadDemo">Wczytaj przykładowe dane</button>
      </div></div>`;
  }
  const t = today(), ws = weekStart(t), we = addDays(ws, 6), ms = monthStart(t), me = monthEnd(t);
  const nms = addDays(me, 1), nme = monthEnd(nms);
  const wEv = events(ws, we), mEv = events(ms, me);
  const wDone = wEv.filter(isCharged), mDone = mEv.filter(isCharged);
  const weekPay = paymentsIn(ws, we), monthPay = paymentsIn(ms, me);
  const cashWeek = sumAmt(weekPay.filter(p => p.method === 'cash'));
  const cashMonth = sumAmt(monthPay.filter(p => p.method === 'cash'));
  const bals = db.students.map(s => ({s, b:balance(s.id)}));
  const debtors = bals.filter(x => x.b < 0).sort((a, b) => a.b - b.b);
  const debt = round2(debtors.reduce((a, x) => a - x.b, 0));
  const over = round2(bals.filter(x => x.b > 0).reduce((a, x) => a + x.b, 0));
  const todayEv = events(t, t).filter(e => e.status !== 'cancelled');
  const conf = toConfirm();
  const sw = scheduleWeekly();
  const f7 = sumEvents(events(t, addDays(t, 6)), 'forecast');
  const f14 = sumEvents(events(t, addDays(t, 13)), 'forecast');
  const nextMonth = sumEvents(events(nms, nme), 'forecast');

  const backupDays = db.settings.lastBackup ? daysBetween(db.settings.lastBackup.slice(0,10), t) : null;
  const backupNote = (backupDays === null || backupDays > 14) && db.lessons.length + db.payments.length > 5
    ? `<div class="notice">💾 ${backupDays === null ? 'Nie masz jeszcze kopii zapasowej danych.' : `Ostatnia kopia zapasowa: ${backupDays} dni temu.`}
       <button class="btn sm" data-act="exportJson">Zrób kopię teraz</button></div>` : '';

  return `${backupNote}
  <div class="pagehead"><h2>${DAYS[weekday(t)]}, ${fmtDate(t)}</h2></div>
  <div class="grid g4">
    ${stat('Zarobione w tym tygodniu', zl(sumEvents(wEv, 'earned')), `${wDone.length} zajęć · prognoza ${zl(sumEvents(wEv, 'forecast'))}`)}
    ${stat('Zarobione w tym miesiącu', zl(sumEvents(mEv, 'earned')), `${mDone.length} zajęć · prognoza ${zl(sumEvents(mEv, 'forecast'))}`)}
    ${stat('Wpłaty w tym miesiącu', zl(sumAmt(monthPay)), `gotówka ${zl(cashMonth)} · tydzień ${zl(sumAmt(weekPay))} (got. ${zl(cashWeek)})`)}
    ${stat('Uczniowie winni łącznie', zl(debt), over > 0 ? `nadpłaty u uczniów: ${zl(over)}` : 'brak nadpłat', debt > 0 ? 'neg' : '')}
  </div>

  <h3>Prognoza przychodów</h3>
  <div class="grid g4">
    ${stat('Najbliższe 7 dni', zl(f7), 'zaplanowane + z planu stałego')}
    ${stat('Najbliższe 2 tygodnie', zl(f14), 'zaplanowane + z planu stałego')}
    ${stat(`${MONTHS[parse(nms).getMonth()]} (cały miesiąc)`, zl(nextMonth), 'na podstawie planu')}
    ${stat('Stały plan', zl(sw.amount) + ' / tydz.', `2 tyg.: ${zl(sw.amount*2)} · miesiąc ≈ ${zl(sw.amount*52/12)}`)}
  </div>

  <div class="grid g2" style="margin-top:6px">
    <div>
      <h3>Dziś (${todayEv.length})</h3>
      ${todayEv.length ? todayEv.map(e => evRow(e, {actions: e.status === 'planned'})).join('') : `<div class="card empty">Dziś bez zajęć 🎉</div>`}
    </div>
    <div>
      <h3>Do potwierdzenia (${conf.length}) ${conf.length > 1 ? `<button class="btn sm" style="float:right;text-transform:none;letter-spacing:0" data-act="confirmAll">✓ Wszystkie odbyte</button>` : ''}</h3>
      ${conf.length ? conf.slice().reverse().map(e => evRow(e, {date:true, actions:true})).join('') : `<div class="card empty">Wszystko potwierdzone ✓</div>`}
    </div>
  </div>

  <h3>Saldo uczniów</h3>
  <div class="card list">
    ${bals.filter(x => !x.s.archived || x.b !== 0).sort((a, b) => a.b - b.b).map(({s, b}) => `
      <div class="item" data-act="openStudent" data-id="${esc(s.id)}">
        <div class="avatar" style="background:${esc(s.color)}">${esc(initials(s.name))}</div>
        <div class="grow"><div class="ellipsis"><b>${esc(s.name)}</b></div><div class="small muted ellipsis">${esc(s.subject || '')}</div></div>
        ${balanceBadge(b)}
        ${b < 0 ? `<button class="btn sm" data-act="addPayment" data-sid="${esc(s.id)}">+ Wpłata</button>` : ''}
      </div>`).join('') || '<div class="empty">Brak uczniów</div>'}
  </div>`;
}

/* ---------- KALENDARZ ---------- */
function viewCal(){
  const d = state.calDate;
  let title, body;
  if(state.cal === 'week'){
    const ws = weekStart(d), we = addDays(ws, 6), t = today();
    const evs = events(ws, we);
    title = `${fmtDayMonth(ws)} – ${fmtDayMonth(we)} ${parse(we).getFullYear()}`;
    const active = evs.filter(e => e.status !== 'cancelled');
    const mins = active.reduce((a, e) => a + (+e.duration), 0);
    body = `<div class="row small muted" style="margin-bottom:10px">
        <span>${active.length} zajęć · ${hours(mins)}</span><span>·</span>
        <span>zarobione ${zl(sumEvents(evs, 'earned'))}</span><span>·</span>
        <span>prognoza tygodnia <b>${zl(sumEvents(evs, 'forecast'))}</b></span></div>
      <div class="week">${[0,1,2,3,4,5,6].map(i => {
        const day = addDays(ws, i), de = evs.filter(e => e.date === day);
        return `<div class="day ${day === t ? 'today' : ''}">
          <div class="day-h"><b>${DAYS_SHORT[i]}</b><span>${fmtDayMonth(day)}</span></div>
          ${de.map(e => evRow(e)).join('')}
          <button class="add" data-act="addLesson" data-date="${day}">+ zajęcia</button>
        </div>`;
      }).join('')}</div>`;
  }else{
    const ms = monthStart(d), me = monthEnd(d), gs = weekStart(ms), ge = addDays(weekStart(me), 6), t = today();
    const evs = events(gs, ge), mEv = evs.filter(e => e.date >= ms && e.date <= me);
    title = monthLabel(d.slice(0, 7));
    const cells = [];
    for(let day = gs; day <= ge; day = addDays(day, 1)){
      const de = evs.filter(e => e.date === day);
      cells.push(`<div class="mc ${day < ms || day > me ? 'out' : ''} ${day === t ? 'today' : ''}" data-act="calDay" data-date="${day}">
        <div class="n">${parse(day).getDate()}</div>
        ${de.slice(0, 4).map(e => `<div class="chip st-${e.status}" style="--c:${esc(scolor(e.studentId))}">${e.time} ${esc(sname(e.studentId).split(' ')[0])}</div>`).join('')}
        ${de.length > 4 ? `<div class="small muted">+${de.length - 4}</div>` : ''}
      </div>`);
    }
    body = `<div class="row small muted" style="margin-bottom:10px">
        <span>${mEv.filter(e => e.status !== 'cancelled').length} zajęć</span><span>·</span>
        <span>zarobione ${zl(sumEvents(mEv, 'earned'))}</span><span>·</span>
        <span>prognoza miesiąca <b>${zl(sumEvents(mEv, 'forecast'))}</b></span></div>
      <div class="month">${DAYS_SHORT.map(x => `<div class="mh">${x}</div>`).join('')}${cells.join('')}</div>
      <p class="hint">Kliknij dzień, aby zobaczyć szczegóły tygodnia.</p>`;
  }
  return `<div class="pagehead">
      <h2>${title}</h2>
      <div class="seg"><button class="${state.cal === 'week' ? 'on' : ''}" data-act="calMode" data-mode="week">Tydzień</button><button class="${state.cal === 'month' ? 'on' : ''}" data-act="calMode" data-mode="month">Miesiąc</button></div>
      <button class="btn" data-act="calNav" data-dir="-1">‹</button>
      <button class="btn" data-act="calToday">Dziś</button>
      <button class="btn" data-act="calNav" data-dir="1">›</button>
    </div>${body}
    <p class="hint">Przerywana ramka = termin wynikający ze stałego planu ucznia. Kliknij, aby potwierdzić, przenieść lub odwołać.</p>`;
}

            return `<tr class="click" data-act="openEvent" data-id="${esc(e.l.id)}"><td>${fmtDateShort(e.date)}</td><td>📘 ${STATUS[e.l.status]} ${e.l.time} (${e.l.duration} min)${e.l.note ? ` <span class="muted small">${esc(e.l.note)}</span>` : ''}</td><td class="r ${e.amount ? 'neg' : 'muted'}">${e.amount ? zlSigned(e.amount) : '0 zł'}</td><td class="r">${zlSigned(e.run)}</td></tr>`;

}

/* ---------- RAPORTY ---------- */
function monthEarned(ym){
  const ms = ym + '-01', me = monthEnd(ms);
  return round2(db.lessons.filter(l => l.date >= ms && l.date <= me && isCharged(l)).reduce((a, l) => a + (+l.price), 0));
}
function viewRep(){
  const ym = state.repMonth, ms = ym + '-01', me = monthEnd(ms);
  const evs = events(ms, me);
  const charged = evs.filter(isCharged);
  const pays = paymentsIn(ms, me);
  const mins = charged.reduce((a, l) => a + (+l.duration), 0);
  const earned = sumEvents(evs, 'earned');
  const forecast = sumEvents(evs, 'forecast');
  const cancelled = evs.filter(e => e.status === 'cancelled').length;

  const rows = db.students.map(s => {
    const se = charged.filter(l => l.studentId === s.id);
    const sp = pays.filter(p => p.studentId === s.id);
    return {s, n:se.length, mins:se.reduce((a, l) => a + (+l.duration), 0), earned:round2(se.reduce((a, l) => a + (+l.price), 0)),
            paid:sumAmt(sp), cash:sumAmt(sp.filter(p => p.method === 'cash')), bal:balance(s.id)};
  }).filter(r => r.n || r.paid).sort((a, b) => b.earned - a.earned);

  // ostatnie 12 miesięcy
  const months = []; for(let i = 11; i >= 0; i--) months.push(shiftMonth(today().slice(0, 7), -i));
  const data = months.map(m => ({m, e:monthEarned(m), p:sumAmt(paymentsIn(m + '-01', monthEnd(m + '-01')))}));
  const max = Math.max(1, ...data.map(d => Math.max(d.e, d.p)));
  const year = ym.slice(0, 4);
  const yEarned = round2(db.lessons.filter(l => l.date.startsWith(year) && isCharged(l)).reduce((a, l) => a + (+l.price), 0));
  const yPaid = sumAmt(db.payments.filter(p => p.date.startsWith(year)));
  const yCash = sumAmt(db.payments.filter(p => p.date.startsWith(year) && p.method === 'cash'));
  // dla bieżącego miesiąca dzielimy przez tygodnie, które już minęły
  const lastDay = today() >= ms && today() <= me ? today() : me;
  const weeksInMonth = Math.max(1, daysBetween(ms, lastDay) + 1) / 7;

  return `<div class="pagehead">
      <h2>Raport · ${monthLabel(ym)}</h2>
      <button class="btn" data-act="repNav" data-dir="-1">‹</button>
      <button class="btn" data-act="repNav" data-dir="1">›</button>
    </div>
    <div class="grid g4">
      ${stat('Zarobione (odbyte)', zl(earned), `${charged.length} zajęć · ${hours(mins)}`)}
      ${stat('Prognoza całego miesiąca', zl(forecast), `odwołanych: ${cancelled}`)}
      ${stat('Otrzymane wpłaty', zl(sumAmt(pays)), `gotówka ${zl(sumAmt(pays.filter(p => p.method === 'cash')))}`)}
      ${stat('Średnio na tydzień', zl(earned / weeksInMonth), mins ? `średnio ${zl(earned / (mins / 60))} / h` : '—')}
    </div>
    <h3>Według uczniów</h3>
    <div class="card scroll-x" style="padding:6px 10px">
      ${rows.length ? `<table class="tbl"><thead><tr><th>Uczeń</th><th class="r">Zajęcia</th><th class="r">Godziny</th><th class="r">Zarobione</th><th class="r">Wpłacił</th><th class="r">w tym gotówką</th><th class="r">Saldo teraz</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="click" data-act="openStudent" data-id="${esc(r.s.id)}"><td><span class="dot" style="display:inline-block;background:${esc(r.s.color)};margin-right:6px"></span>${esc(r.s.name)}</td><td class="r">${r.n}</td><td class="r">${hours(r.mins)}</td><td class="r">${zl(r.earned)}</td><td class="r">${zl(r.paid)}</td><td class="r">${zl(r.cash)}</td><td class="r ${r.bal < 0 ? 'neg' : r.bal > 0 ? 'pos' : ''}">${zlSigned(r.bal)}</td></tr>`).join('')}
        <tr><td><b>Razem</b></td><td class="r"><b>${charged.length}</b></td><td class="r"><b>${hours(mins)}</b></td><td class="r"><b>${zl(earned)}</b></td><td class="r"><b>${zl(sumAmt(pays))}</b></td><td class="r"><b>${zl(sumAmt(pays.filter(p => p.method === 'cash')))}</b></td><td></td></tr>
      </tbody></table>` : '<div class="empty">Brak danych w tym miesiącu</div>'}
    </div>
    <h3>Ostatnie 12 miesięcy</h3>
    <div class="card">
      <div class="bars">${data.map(d => `<div class="bar-col" title="${monthLabel(d.m)}: zarobione ${zl(d.e)}, wpłaty ${zl(d.p)}">
        <div class="bar-pair"><div class="bar a" style="height:${d.e / max * 100}%"></div><div class="bar b" style="height:${d.p / max * 100}%"></div></div>
        <div class="bar-lbl">${MONTHS_SHORT[+d.m.slice(5) - 1]}</div></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>zarobione (odbyte zajęcia)</span><span><i style="background:var(--ok)"></i>otrzymane wpłaty</span></div>
    </div>
    <h3>Rok ${year}</h3>
    <div class="grid g3">
      ${stat('Zarobione w roku', zl(yEarned))}
      ${stat('Wpłaty w roku', zl(yPaid))}
      ${stat('W tym gotówką', zl(yCash))}
    </div>`;
}

const forms = {
  student(f){
    const v = Object.fromEntries(new FormData(f));
    const fd = new FormData(f);
    const days = fd.getAll('sday'), times = fd.getAll('stime'), durs = fd.getAll('sdur'), every = fd.getAll('severy');
    const schedule = days.map((d, i) => ({day:+d, time:times[i], duration:+durs[i], every:+every[i]})).filter(x => x.time);
    const data = {name:v.name.trim(), phone:v.phone.trim(), email:v.email.trim(), parentName:v.parentName.trim(), parentPhone:v.parentPhone.trim(),
                  subject:v.subject.trim(), level:v.level.trim(), rate:v.rate === '' ? '' : +v.rate, color:v.color, notes:v.notes,
                  schedule, scheduleFrom:v.scheduleFrom || today(), scheduleTo:v.scheduleTo || '', openingBalance:+v.openingBalance || 0};
    const id = f.dataset.id;
    if(id){
      const s = student(id);
      const changed = JSON.stringify(s.schedule || []) !== JSON.stringify(schedule) || (s.scheduleFrom || '') !== data.scheduleFrom || (s.scheduleTo || '') !== data.scheduleTo;
      if(changed){
        // minione, niepotwierdzone terminy starego planu zapisujemy – zostają w „Do potwierdzenia”
        freezePast(id);
        if(data.scheduleFrom !== (s.scheduleFrom || '')) data.anchor = data.scheduleFrom;
        else if(data.scheduleFrom < today()){
          // nowy plan obowiązuje od dziś; tydzień odniesienia dla „co 2 tyg.” zostaje ten sam
          data.anchor = s.anchor || s.scheduleFrom;
          data.scheduleFrom = today();
        }
      }
      Object.assign(s, data);
      toast('Zapisano');
    }else{
      const s = {id:uid(), created:today(), archived:false, ...data};
      db.students.push(s);
      toast('Dodano ucznia');
    }
    save(); closeModal(); render();
  },
  lesson(f){
    const v = Object.fromEntries(new FormData(f));
    const data = {studentId:v.studentId, date:v.date, time:v.time, duration:+v.duration, price:+v.price, status:v.status, note:v.note};
    let l;
    if(f.dataset.id){ l = db.lessons.find(x => x.id === f.dataset.id); Object.assign(l, data); }
    else if(f.dataset.slot){ const ve = vcache.get(f.dataset.slot); l = materialize(ve, data); }
    else{ l = materialize({...data, slotKey:null}, data); }
    if(v.paidCash){
      db.payments.push({id:uid(), studentId:l.studentId, date:l.date, amount:l.price, method:'cash', note:'Za zajęcia ' + fmtDateShort(l.date), lessonId:l.id});
    }
    save(); closeModal(); render(); toast('Zapisano zajęcia');
  },
  payment(f){
    const v = Object.fromEntries(new FormData(f));
    const data = {studentId:v.studentId, date:v.date, amount:round2(+v.amount), method:v.method, note:v.note.trim()};
    if(f.dataset.id) Object.assign(db.payments.find(p => p.id === f.dataset.id), data);
    else db.payments.push({id:uid(), ...data});
    save(); closeModal(); render(); toast('Zapisano wpłatę: ' + zl(data.amount));
  },
  settings(f){
    const v = Object.fromEntries(new FormData(f));
    db.settings.defaultRate = +v.defaultRate || 0;
    db.settings.defaultDuration = +v.defaultDuration || 60;
    save(); render(); toast('Zapisano ustawienia');
  }
};

/* =========================================================
   AKCJE (kliknięcia)
   ========================================================= */
const actions = {
  tab(d){ state.tab = d.tab; state.studentId = null; render(); window.scrollTo(0, 0); },
  quickAdd(){
    openModal('Dodaj', `<div class="menu">
      <button class="btn" data-act="addLesson">📘 Zajęcia</button>
      <button class="btn" data-act="addPayment">💰 Wpłatę</button>
      <button class="btn" data-act="addStudent">👤 Ucznia</button></div>`);
  },
  closeModal,
  addStudent(){ studentForm(); },
  editStudent(d){ studentForm(student(d.id)); },
  openStudent(d){ closeModal(); state.tab = 'students'; state.studentId = d.id; render(); window.scrollTo(0, 0); },
  backStudents(){ state.studentId = null; render(); },
  toggleArchived(){ state.showArchived = !state.showArchived; render(); },
  archiveStudent(d){
    const s = student(d.id);
    if(!s.archived){
      if(!confirm(`Zarchiwizować ucznia ${s.name}? Stały plan przestanie generować zajęcia, historia i saldo zostaną.`)) return;
      freezePast(s.id);
    }
    s.archived = !s.archived; save(); closeModal(); render(); toast(s.archived ? 'Zarchiwizowano' : 'Przywrócono');
  },
  deleteStudent(d){
    const s = student(d.id);
    if(!confirm(`Usunąć ucznia ${s.name} RAZEM z całą historią zajęć i wpłat? Tego nie da się cofnąć.\n\n(Jeśli chcesz tylko ukryć ucznia – użyj „Archiwizuj”.)`)) return;
    db.students = db.students.filter(x => x.id !== s.id);
    db.lessons = db.lessons.filter(x => x.studentId !== s.id);
    db.payments = db.payments.filter(x => x.studentId !== s.id);
    state.studentId = null; save(); closeModal(); render(); toast('Usunięto ucznia');
  },
  addSchedRow(){ $('#schedRows').insertAdjacentHTML('beforeend', schedRow()); },
  delSchedRow(d, el){ el.closest('.sched-row').remove(); },
  addLesson(d){ lessonForm(null, {date:d.date, sid:d.sid || state.studentId}); },
  openEvent(d){ const e = findEvent(d); if(e) lessonForm(e); },
  quick(d){ const e = findEvent(d); if(!e) return; applyQuick(e, d.how); closeModal(); render(); },
  confirmAll(){
    const list = toConfirm();
    if(!confirm(`Oznaczyć ${list.length} zajęć jako odbyte (bez wpłaty)?`)) return;
    list.forEach(e => applyQuick(e, 'done')); render(); toast(`Potwierdzono ${list.length} zajęć`);
  },
  deleteLesson(d){
    const l = db.lessons.find(x => x.id === d.id);
    if(!confirm('Usunąć te zajęcia?')) return;
    const linked = db.payments.filter(p => p.lessonId === l.id);
    if(linked.length && confirm(`Do tych zajęć jest przypisana wpłata (${linked.map(p => zl(p.amount)).join(', ')}). Usunąć też wpłatę?\n\nOK = usuń wpłatę, Anuluj = zostaw wpłatę (zostanie jako nadpłata).`)){
      db.payments = db.payments.filter(p => p.lessonId !== l.id);
    }
    if(l.slotKey){
      // termin z planu – zostawiamy ślad jako „odwołane”, żeby nie wrócił w kalendarzu
      l.status = 'cancelled'; l.note = (l.note ? l.note + ' · ' : '') + 'usunięte';
      if(!confirm('To był termin ze stałego planu. OK = oznacz jako odwołany (nie pojawi się ponownie). Anuluj = usuń całkiem (termin z planu wróci do kalendarza).')){
        db.lessons = db.lessons.filter(x => x.id !== l.id);
      }
    }else db.lessons = db.lessons.filter(x => x.id !== l.id);
    save(); closeModal(); render(); toast('Usunięto');
  },
  addPayment(d){ paymentForm(null, {sid:d.sid || state.studentId}); },
  editPayment(d){ paymentForm(db.payments.find(p => p.id === d.id)); },
  deletePayment(d){
    if(!confirm('Usunąć tę wpłatę?')) return;
    db.payments = db.payments.filter(p => p.id !== d.id); save(); closeModal(); render(); toast('Usunięto wpłatę');
  },
  pickMethod(d, el){
    el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
    el.closest('form').elements.method.value = d.m;
  },
  calMode(d){ state.cal = d.mode; render(); },
  calNav(d){
    const n = +d.dir;
    if(state.cal === 'week') state.calDate = addDays(state.calDate, 7 * n);
    else state.calDate = shiftMonth(state.calDate.slice(0, 7), n) + '-01';
    render();
  },
  calToday(){ state.calDate = today(); render(); },
  calDay(d){ state.cal = 'week'; state.calDate = d.date; render(); },
  payNav(d){ state.payMonth = shiftMonth(state.payMonth, +d.dir); render(); },
  repNav(d){ state.repMonth = shiftMonth(state.repMonth, +d.dir); render(); },
  exportJson(){
    db.settings.lastBackup = new Date().toISOString(); save();
    download(`korepetycje-kopia-${today()}.json`, JSON.stringify(db, null, 2), 'application/json');
    render(); toast('Pobrano kopię zapasową');
  },
  importJson(){
    let inp = $('#importFile');
    if(!inp){ inp = document.createElement('input'); inp.type = 'file'; inp.id = 'importFile'; inp.accept = '.json,application/json'; inp.hidden = true; document.body.appendChild(inp); }
    inp.value = '';
    inp.onchange = () => {
      const file = inp.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const d = JSON.parse(r.result);
          if(!Array.isArray(d.students) || !Array.isArray(d.lessons) || !Array.isArray(d.payments)) throw new Error('To nie jest plik kopii z tej aplikacji');
          if(!confirm(`Wczytać kopię? (${d.students.length} uczniów, ${d.lessons.length} zajęć, ${d.payments.length} wpłat)\nObecne dane zostaną ZASTĄPIONE.`)) return;
          const e = emptyDb(); db = {...e, ...d, settings:{...e.settings, ...(d.settings || {})}};
          save(); render(); toast('Wczytano kopię');
        }catch(err){ alert('Nie udało się wczytać pliku: ' + err.message); }
      };
      r.readAsText(file);
    };
    inp.click();
  },
  exportCsv(d){
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const num = v => String(round2(v)).replace('.', ',');
    let rows;
    if(d.what === 'lessons'){
      rows = [['Data','Godzina','Uczeń','Minuty','Cena','Status','Notatka']]
        .concat(db.lessons.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
          .map(l => [l.date, l.time, sname(l.studentId), l.duration, num(l.price), STATUS[l.status], l.note || '']));
    }else{
      rows = [['Data','Uczeń','Kwota','Forma','Notatka']]
        .concat(db.payments.slice().sort((a, b) => a.date.localeCompare(b.date))
          .map(p => [p.date, sname(p.studentId), num(p.amount), METHODS[p.method] || p.method, p.note || '']));
    }
    download(`korepetycje-${d.what === 'lessons' ? 'zajecia' : 'wplaty'}-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  },
  loadDemo(){
    if(db.students.length && !confirm('Dodać przykładowe dane do istniejących?')) return;
    loadDemo(); render(); toast('Wczytano przykładowe dane');
  },
  wipe(){
    if(!confirm('Usunąć WSZYSTKIE dane (uczniów, zajęcia, wpłaty)? Zrób najpierw kopię zapasową!')) return;
    if(!confirm('Na pewno? Tego nie da się cofnąć.')) return;
    db = emptyDb(); save(); state.studentId = null; render(); toast('Wyczyszczono dane');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = actions[el.dataset.act];
  if(!fn) return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset, el);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if(f.dataset.form && forms[f.dataset.form]){ e.preventDefault(); forms[f.dataset.form](f); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'search'){ state.search = t.value; $('#slist').innerHTML = studentListHtml(); return; }
  const f = t.form;
  if(f?.dataset.form === 'lesson'){
    if(t.name === 'price'){ t.dataset.manual = '1'; return; }
    if((t.name === 'studentId' || t.name === 'duration') && !f.elements.price.dataset.manual){
      f.elements.price.value = priceFor(f.elements.studentId.value, +f.elements.duration.value);
    }
  }
  if(f?.dataset.form === 'payment' && t.name === 'studentId' && !f.dataset.id){
    const b = balance(t.value);
    $('#payBal').innerHTML = 'Aktualne saldo: ' + balanceBadge(b);
    f.elements.amount.value = b < 0 ? -b : priceFor(t.value, db.settings.defaultDuration);
  }
});
document.addEventListener('change', e => {
  // selecty na niektórych przeglądarkach mobilnych wysyłają tylko 'change'
  if(e.target.tagName === 'SELECT') e.target.dispatchEvent(new Event('input', {bubbles:true}));
});
// odśwież co minutę (statusy „do potwierdzenia”), ale nie gdy otwarte okno
setInterval(() => { if(!dlg.open && document.visibilityState === 'visible' && document.activeElement?.id !== 'search') render(); }, 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && !dlg.open){ db = load(); render(); } });

/* ---------- przykładowe dane ---------- */
function loadDemo(){
  const t = today(), from = addDays(weekStart(t), -28);
  const mk = (name, subject, level, rate, schedule, extra = {}) => {
    const s = {id:uid(), created:from, archived:false, name, subject, level, rate, schedule, scheduleFrom:from, scheduleTo:'',
               color:PALETTE[db.students.length % PALETTE.length], phone:'', email:'', parentName:'', parentPhone:'', notes:'', openingBalance:0, ...extra};
    db.students.push(s); return s;
  };
  const a = mk('Ania Kowalska', 'Matematyka', '8 SP', 80, [{day:1, time:'16:00', duration:60, every:1}, {day:3, time:'17:00', duration:60, every:1}],
               {phone:'600 100 200', parentName:'Pani Kowalska', parentPhone:'600 100 201', notes:'Przygotowanie do egzaminu ósmoklasisty.'});
  const b = mk('Kuba Nowak', 'Fizyka', '2 LO', 100, [{day:2, time:'18:00', duration:90, every:1}], {phone:'601 222 333'});
  const c = mk('Ola Wiśniewska', 'Matematyka', 'matura rozszerzona', 120, [{day:4, time:'15:30', duration:60, every:1}], {phone:'602 444 555', notes:'Płaci z góry za miesiąc.'});
  const d = mk('Michał Zieliński', 'Angielski', '6 SP', 70, [{day:5, time:'10:00', duration:60, every:2}], {phone:'603 666 777'});
  // potwierdź minione terminy (poza ostatnimi dwoma dniami – zostaną „do potwierdzenia”)
  for(const v of virtualOcc(from, addDays(t, -3))){
    if(v.studentId === b.id && Math.random() < .15){ materialize(v, {status:'cancelled'}); continue; }
    const l = materialize(v, {status:'done'});
    if(v.studentId === a.id) db.payments.push({id:uid(), studentId:a.id, date:l.date, amount:l.price, method:'cash', note:'Za zajęcia ' + fmtDateShort(l.date), lessonId:l.id});
    if(v.studentId === d.id) db.payments.push({id:uid(), studentId:d.id, date:l.date, amount:l.price, method:'blik', note:'', lessonId:l.id});
  }
  db.payments.push({id:uid(), studentId:b.id, date:addDays(from, 10), amount:300, method:'transfer', note:'za 2 zajęcia'});
  db.payments.push({id:uid(), studentId:c.id, date:from, amount:600, method:'transfer', note:'z góry za 5 zajęć'});
  db.payments.push({id:uid(), studentId:c.id, date:monthStart(t), amount:480, method:'cash', note:'z góry'});
  save();
}

render();
</script>
